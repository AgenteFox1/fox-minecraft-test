name: Minecraft Test

on:
  workflow_dispatch:

jobs:
  minecraft:
    runs-on: ubuntu-latest

    steps:
      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Baixar Paper 1.21.11
        run: |
          mkdir minecraft
          cd minecraft

          echo "Consultando PaperMC..."

          RESPONSE=$(curl -fsSL \
            -H "User-Agent: fox-minecraft-test/1.0" \
            "https://fill.papermc.io/v3/projects/paper/versions/1.21.11/builds")

          DOWNLOAD_URL=$(echo "$RESPONSE" | \
            jq -r 'map(select(.channel == "STABLE")) | .[0].downloads["server:default"].url')

          echo "Download: $DOWNLOAD_URL"

          curl -fL \
            -H "User-Agent: fox-minecraft-test/1.0" \
            -o paper.jar \
            "$DOWNLOAD_URL"

          ls -lh paper.jar

      - name: Aceitar EULA
        run: |
          echo "eula=true" > minecraft/eula.txt

      - name: Iniciar Playit
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          echo "Iniciando Playit..."

          docker run \
            -d \
            --name playit \
            --network host \
            -e SECRET_KEY="$PLAYIT_SECRET" \
            ghcr.io/playit-cloud/playit-agent:latest

          echo "Playit iniciado."

          sleep 5

          docker logs playit

      - name: Iniciar Minecraft
        run: |
          cd minecraft

          echo "Iniciando Minecraft..."

          java \
            -Xms2G \
            -Xmx8G \
            -jar paper.jar \
            nogui

      - name: Logs do Playit
        if: always()
        run: |
          docker logs playit || true
