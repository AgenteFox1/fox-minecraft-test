
name: Minecraft Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minecraft:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    env:
      MC_VERSION: "1.21.11"
      SERVER_DIR: minecraft

      PLUGIN_ZIP_ID: "18k_jycr7HE0cgaVgnzgCBSqRJ9gIFcNb"

      WORLD_ID: "1Mf7FoRa_P9Q9idPExaTa6S1hQz5sPbT-"
      NETHER_ID: "1TDVch0u3PyuYrYtTTIYsroJm5dcQNrQM"
      END_ID: "1SMTsfqiLlW3R3FpcgfQYZSNwhBw0JJgt"

    steps:
      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar ferramentas necessárias
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y rclone jq unzip tar gzip curl python3-pip file

      - name: Verificar Docker existente
        shell: bash
        run: |
          set -Eeuo pipefail

          if ! command -v docker >/dev/null 2>&1; then
            echo "::error::Docker não está disponível no runner."
            exit 1
          fi

          docker info

      - name: Configurar Google Drive
        shell: bash
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          set -Eeuo pipefail

          [[ -n "${RCLONE_CONFIG_B64:-}" ]] || {
            echo "::error::RCLONE_CONFIG_B64 está vazio."
            exit 1
          }

          [[ -n "${GDRIVE_FOLDER_ID:-}" ]] || {
            echo "::error::GDRIVE_FOLDER_ID está vazio."
            exit 1
          }

          mkdir -p "$HOME/.config/rclone"

          printf '%s' "$RCLONE_CONFIG_B64" |
            base64 --decode > "$HOME/.config/rclone/rclone.conf"

          chmod 600 "$HOME/.config/rclone/rclone.conf"

          echo "RCLONE_CONFIG_GDRIVE2_ROOT_FOLDER_ID=$GDRIVE_FOLDER_ID" >> "$GITHUB_ENV"

          if ! rclone lsf gdrive2: >/dev/null; then
            echo "::error::Falha ao acessar o Google Drive. Verifique a autenticação."
            exit 1
          fi

          echo "Google Drive acessível."

      - name: Preparar diretórios
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$SERVER_DIR" /tmp/minecraft-restore

      - name: Restaurar backup completo mais recente
        shell: bash
        run: |
          set -Eeuo pipefail

          if rclone copyto \
            "gdrive2:server-backup-latest.tar.gz" \
            "/tmp/server-backup-latest.tar.gz" \
            --retries 3 --low-level-retries 5; then

            if ! gzip -t /tmp/server-backup-latest.tar.gz; then
              echo "::error::O backup mais recente está corrompido."
              exit 1
            fi

            tar -xzf /tmp/server-backup-latest.tar.gz \
              -C "$GITHUB_WORKSPACE"

            touch /tmp/minecraft-backup-restored
            echo "Backup completo restaurado."
          else
            echo "Backup completo não encontrado. Será tentada a restauração dos mundos individuais."
          fi

      - name: Restaurar mundos individuais se necessário
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -f /tmp/minecraft-backup-restored ]]; then
            echo "Mundos já restaurados pelo backup completo."
            exit 0
          fi

          find_drive_path_by_id() {
            local file_id="$1"

            rclone lsjson gdrive2: --recursive --files-only --metadata |
              jq -er --arg id "$file_id" \
                'first(.[] | select(.ID == $id) | .Path) // empty'
          }

          restore_world() {
            local name="$1"
            local id="$2"
            local path

            if ! path="$(find_drive_path_by_id "$id")"; then
              echo "::warning::ZIP do mundo $name não encontrado."
              return 0
            fi

            rclone copyto "gdrive2:$path" "/tmp/minecraft-restore/$name.zip" \
              --retries 3 --low-level-retries 5

            unzip -tq "/tmp/minecraft-restore/$name.zip"
            unzip -oq "/tmp/minecraft-restore/$name.zip" -d "$SERVER_DIR"

            echo "Mundo $name restaurado."
          }

          restore_world "world" "$WORLD_ID"
          restore_world "world_nether" "$NETHER_ID"
          restore_world "world_the_end" "$END_ID"

      - name: Baixar e restaurar ZIP de plugins
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Instalando ferramenta de download do Google Drive..."
          python3 -m pip install --break-system-packages gdown

          echo "Baixando pacote de plugins..."

          PLUGIN_URL="https://drive.google.com/uc?id=$PLUGIN_ZIP_ID"

          gdown "$PLUGIN_URL" -O /tmp/plugins.zip

          if [[ ! -s /tmp/plugins.zip ]]; then
            echo "::error::O download do ZIP de plugins falhou."
            exit 1
          fi

          if ! unzip -tq /tmp/plugins.zip; then
            echo "::error::O arquivo baixado não é um ZIP válido."
            exit 1
          fi

          mkdir -p /tmp/plugins-extraidos "$SERVER_DIR/plugins"

          unzip -oq /tmp/plugins.zip -d /tmp/plugins-extraidos

          mapfile -d '' JARS < <(
            find /tmp/plugins-extraidos -type f -iname '*.jar' -print0
          )

          if [[ "${#JARS[@]}" -eq 0 ]]; then
            echo "::error::O ZIP não contém arquivos .jar."
            exit 1
          fi

          for jar in "${JARS[@]}"; do
            cp -f "$jar" "$SERVER_DIR/plugins/"
          done

          echo "Total de arquivos JAR restaurados: ${#JARS[@]}"

          echo "Plugins encontrados:"
          find "$SERVER_DIR/plugins" -maxdepth 1 -type f -name '*.jar' -printf '%f\n'

      - name: Baixar Paper 1.21.11 pela API oficial Fill
        shell: bash
        run: |
          set -Eeuo pipefail

          PROJECT="paper"
          VERSION="$MC_VERSION"
          PAPER_JAR="$SERVER_DIR/paper.jar"

          USER_AGENT="Minecraft-Test-GitHub-Actions/1.0.0 (https://docs.github.com/actions)"

          API_URL="https://fill.papermc.io/v3/projects/$PROJECT/versions/$VERSION/builds"

          echo "Consultando builds oficiais do Paper $VERSION..."

          curl -fL --retry 3 \
            --retry-delay 3 \
            -H "User-Agent: $USER_AGENT" \
            -H "Accept: application/json" \
            "$API_URL" \
            -o /tmp/paper-builds.json

          echo "Selecionando a última build estável..."

          if jq -e '.ok == false' /tmp/paper-builds.json >/dev/null 2>&1; then
            echo "::error::A API PaperMC retornou um erro."
            jq . /tmp/paper-builds.json
            exit 1
          fi

          BUILD_INFO="$(
            jq -cer '
              first(.[] | select(.channel == "STABLE"))
              // error("Nenhuma build estável encontrada")
            ' /tmp/paper-builds.json
          )"

          BUILD="$(jq -er '.id' <<< "$BUILD_INFO")"

          DOWNLOAD_URL="$(
            jq -er '.downloads["server:default"].url' <<< "$BUILD_INFO"
          )"

          EXPECTED_SHA256="$(
            jq -er '.downloads["server:default"].checksums.sha256' <<< "$BUILD_INFO"
          )"

          echo "Build selecionada: $BUILD"
          echo "Baixando Paper..."

          curl -fL --retry 3 \
            --retry-delay 3 \
            -H "User-Agent: $USER_AGENT" \
            "$DOWNLOAD_URL" \
            -o "$PAPER_JAR"

          if [[ ! -s "$PAPER_JAR" ]]; then
            echo "::error::O arquivo Paper baixado está vazio."
            exit 1
          fi

          echo "Verificando integridade SHA256..."

          ACTUAL_SHA256="$(sha256sum "$PAPER_JAR" | awk '{print $1}')"

          if [[ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]]; then
            echo "::error::O SHA256 do Paper não corresponde ao valor oficial."
            rm -f "$PAPER_JAR"
            exit 1
          fi

          if ! file "$PAPER_JAR" | grep -qi 'java archive\|zip archive'; then
            echo "::error::O arquivo baixado não parece ser um JAR válido."
            file "$PAPER_JAR" || true
            exit 1
          fi

          echo "Paper $VERSION build $BUILD baixado e verificado com sucesso."

      - name: Preparar configurações
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$SERVER_DIR"

          if [[ ! -f server.properties ]]; then
            cat > server.properties <<'PROPERTIES'
          online-mode=false
          enable-command-block=true
          server-port=25565
          motd=Servidor Minecraft
          view-distance=8
          simulation-distance=6
          PROPERTIES
          fi

          if [[ ! -f eula.txt ]]; then
            echo "eula=true" > eula.txt
          else
            sed -i 's/^eula=false$/eula=true/' eula.txt
          fi

      - name: Iniciar agente Playit
        shell: bash
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          set -Eeuo pipefail

          [[ -n "${PLAYIT_SECRET:-}" ]] || {
            echo "::error::PLAYIT_SECRET está vazio."
            exit 1
          }

          docker pull ghcr.io/playit-cloud/playit-agent:latest

          docker rm -f playit-agent >/dev/null 2>&1 || true

          docker run -d \
            --name playit-agent \
            --network host \
            --restart unless-stopped \
            -e SECRET="$PLAYIT_SECRET" \
            ghcr.io/playit-cloud/playit-agent:latest

          sleep 5

          docker ps --filter name=playit-agent

      - name: Executar servidor e criar backups
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/$SERVER_DIR"

          java -Xms2G -Xmx8G -jar paper.jar --nogui > server.log 2>&1 &
          SERVER_PID=$!

          START_TIME="$(date +%s)"
          MAX_RUNTIME=$((325 * 60))

          backup_server() {
            local archive="$GITHUB_WORKSPACE/server-backup-latest.tar.gz"

            echo "Criando backup do servidor..."

            local tar_status=0

            set +e
            tar --warning=no-file-changed --ignore-failed-read \
              -czf "$archive" -C "$GITHUB_WORKSPACE" "$SERVER_DIR"
            tar_status=$?
            set -e

            if [[ ! -s "$archive" ]] || ! gzip -t "$archive"; then
              echo "::error::Backup inválido."
              return 1
            fi

            if [[ "$tar_status" -ne 0 ]]; then
              echo "::warning::Alguns arquivos mudaram durante o backup."
            fi

            if rclone copyto \
              "gdrive2:server-backup-latest.tar.gz" \
              "gdrive2:server-backup-previous.tar.gz" \
              --retries 2 --low-level-retries 3; then
              echo "Backup anterior preservado."
            fi

            rclone copyto "$archive" "gdrive2:server-backup-latest.tar.gz" \
              --retries 3 --low-level-retries 5

            echo "Backup enviado ao Google Drive."
          }

          sleep 120

          if ! kill -0 "$SERVER_PID" 2>/dev/null; then
            echo "::error::O Minecraft encerrou durante a inicialização."
            tail -n 150 server.log || true
            exit 1
          fi

          backup_server

          while kill -0 "$SERVER_PID" 2>/dev/null; do
            ELAPSED=$(($(date +%s) - START_TIME))

            if (( ELAPSED >= MAX_RUNTIME )); then
              break
            fi

            sleep 600

            if kill -0 "$SERVER_PID" 2>/dev/null; then
              backup_server
            fi
          done

          backup_server

          kill "$SERVER_PID" 2>/dev/null || true

          for _ in {1..30}; do
            kill -0 "$SERVER_PID" 2>/dev/null || break
            sleep 1
          done

          kill -9 "$SERVER_PID" 2>/dev/null || true

          echo "Servidor encerrado e backup final enviado."

      - name: Diagnóstico em caso de falha
        if: ${{ failure() }}
        shell: bash
        run: |
          echo "===== PROCESSOS ====="
          ps aux | grep -E 'java|playit' | grep -v grep || true

          echo "===== LOG DO MINECRAFT ====="
          tail -n 200 minecraft/server.log 2>/dev/null || true

          echo "===== LOG DO PLAYIT ====="
          docker logs --tail 100 playit-agent 2>&1 || true

          echo "===== ARQUIVOS RESTAURADOS ====="
          find minecraft/plugins -maxdepth 1 -type f -name '*.jar' -printf '%f\n' 2>/dev/null || true
