
name: Minecraft Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minecraft:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    env:
      MC_VERSION: "1.21.11"
      SERVER_DIR: minecraft
      PLUGIN_ZIP_ID: "14OF6wa80pT4VOJch7-8kdvs42jRnCj78"
      WORLD_ID: "1Mf7FoRa_P9Q9idPExaTa6S1hQz5sPbT-"
      NETHER_ID: "1TDVch0u3PyuYrYtTTIYsroJm5dcQNrQM"
      END_ID: "1SMTsfqiLlW3R3FpcgfQYZSNwhBw0JJgt"

    steps:
      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar ferramentas necessárias
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y rclone jq unzip tar gzip curl

      - name: Verificar Docker existente no runner
        shell: bash
        run: |
          set -Eeuo pipefail

          if ! command -v docker >/dev/null 2>&1; then
            echo "::error::Docker não está disponível no runner. Nenhuma instalação via APT será tentada."
            exit 1
          fi

          docker info
          echo "Docker disponível."

      - name: Configurar Google Drive
        shell: bash
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          set -Eeuo pipefail

          if [[ -z "${RCLONE_CONFIG_B64:-}" ]]; then
            echo "::error::O segredo RCLONE_CONFIG_B64 está vazio."
            exit 1
          fi

          if [[ -z "${GDRIVE_FOLDER_ID:-}" ]]; then
            echo "::error::O segredo GDRIVE_FOLDER_ID está vazio."
            exit 1
          fi

          mkdir -p "$HOME/.config/rclone"
          printf '%s' "$RCLONE_CONFIG_B64" \
            | base64 --decode > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"

          echo "RCLONE_CONFIG_GDRIVE2_ROOT_FOLDER_ID=$GDRIVE_FOLDER_ID" >> "$GITHUB_ENV"

          if ! rclone lsf gdrive2: >/dev/null; then
            echo "::error::Não foi possível acessar o Google Drive. Verifique a autenticação do rclone e os segredos do GitHub."
            exit 1
          fi

          echo "Google Drive acessível."

      - name: Preparar pasta do servidor
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$SERVER_DIR"
          mkdir -p /tmp/minecraft-restore

      - name: Restaurar backup mais recente
        shell: bash
        run: |
          set -Eeuo pipefail

          if rclone copyto \
            "gdrive2:server-backup-latest.tar.gz" \
            "/tmp/server-backup-latest.tar.gz" \
            --retries 3 --low-level-retries 5; then

            echo "Backup encontrado. Validando arquivo..."

            if ! gzip -t /tmp/server-backup-latest.tar.gz; then
              echo "::error::O backup mais recente está corrompido."
              exit 1
            fi

            tar -xzf /tmp/server-backup-latest.tar.gz \
              -C "$GITHUB_WORKSPACE"

            echo "Backup restaurado."
            touch /tmp/minecraft-backup-restored

          else
            echo "Backup completo não encontrado. Tentando restaurar os mundos individualmente."
          fi

      - name: Restaurar mundos individuais se necessário
        if: ${{ success() }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -f /tmp/minecraft-backup-restored ]]; then
            echo "Os mundos já foram restaurados pelo backup completo."
            exit 0
          fi

          find_drive_path_by_id() {
            local file_id="$1"

            rclone lsjson gdrive2: \
              --recursive \
              --files-only \
              | jq -er --arg id "$file_id" \
                  'first(.[] | select(.ID == $id) | .Path) // empty'
          }

          restore_world() {
            local world_name="$1"
            local file_id="$2"
            local remote_path

            echo "Procurando arquivo do mundo: $world_name"

            if ! remote_path="$(find_drive_path_by_id "$file_id")"; then
              echo "::warning::Não foi encontrado no Drive o ZIP do mundo $world_name."
              return 0
            fi

            rclone copyto "gdrive2:$remote_path" \
              "/tmp/minecraft-restore/$world_name.zip" \
              --retries 3 --low-level-retries 5

            if ! unzip -tq "/tmp/minecraft-restore/$world_name.zip"; then
              echo "::error::O ZIP do mundo $world_name está inválido."
              exit 1
            fi

            mkdir -p "$SERVER_DIR"
            unzip -oq "/tmp/minecraft-restore/$world_name.zip" \
              -d "$SERVER_DIR"

            echo "Mundo $world_name restaurado."
          }

          restore_world "world" "$WORLD_ID"
          restore_world "world_nether" "$NETHER_ID"
          restore_world "world_the_end" "$END_ID"

      - name: Restaurar plugins pelo ZIP do Google Drive
        shell: bash
        run: |
          set -Eeuo pipefail

          find_drive_path_by_id() {
            local file_id="$1"

            rclone lsjson gdrive2: \
              --recursive \
              --files-only \
              | jq -er --arg id "$file_id" \
                  'first(.[] | select(.ID == $id) | .Path) // empty'
          }

          echo "Localizando o ZIP de plugins pelo ID..."

          if ! PLUGIN_REMOTE_PATH="$(find_drive_path_by_id "$PLUGIN_ZIP_ID")"; then
            echo "::error::O ZIP de plugins não foi encontrado no Google Drive. Confira o PLUGIN_ZIP_ID e se o arquivo está dentro da pasta configurada em GDRIVE_FOLDER_ID."
            exit 1
          fi

          rclone copyto "gdrive2:$PLUGIN_REMOTE_PATH" \
            /tmp/plugins.zip \
            --retries 3 --low-level-retries 5

          if ! unzip -tq /tmp/plugins.zip; then
            echo "::error::O ZIP de plugins está corrompido ou não é um ZIP válido."
            exit 1
          fi

          mkdir -p "$SERVER_DIR/plugins"
          mkdir -p /tmp/plugins-extraidos
          unzip -oq /tmp/plugins.zip -d /tmp/plugins-extraidos

          mapfile -d '' JARS < <(
            find /tmp/plugins-extraidos -type f -iname '*.jar' -print0
          )

          if [[ "${#JARS[@]}" -eq 0 ]]; then
            echo "::error::Nenhum arquivo .jar foi encontrado dentro do ZIP."
            exit 1
          fi

          for jar in "${JARS[@]}"; do
            cp -f "$jar" "$SERVER_DIR/plugins/"
          done

          echo "Plugins restaurados: ${#JARS[@]} arquivos .jar."
          echo "As pastas de configuração existentes dos plugins foram preservadas."

      - name: Baixar Paper 1.21.11
        shell: bash
        run: |
          set -Eeuo pipefail

          API="https://api.papermc.io/v3/projects/paper/versions/$MC_VERSION"

          echo "Consultando builds estáveis do Paper $MC_VERSION..."

          curl -fsSL "$API/builds" -o /tmp/paper-builds.json

          BUILD="$(
            jq -er '
              [.builds[] | select(.channel == "STABLE")]
              | max_by(.id)
              | .id
            ' /tmp/paper-builds.json
          )"

          if [[ -z "$BUILD" ]]; then
            echo "::error::Não foi possível identificar uma build estável do Paper."
            exit 1
          fi

          echo "Build selecionada: $BUILD"

          curl -fL --retry 3 \
            "$API/builds/$BUILD/downloads/server:default" \
            -o "$SERVER_DIR/paper.jar"

          test -s "$SERVER_DIR/paper.jar"
          echo "Paper baixado."

      - name: Preparar configurações do servidor
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$SERVER_DIR"

          if [[ ! -f server.properties ]]; then
            cat > server.properties <<'PROPERTIES'
          online-mode=false
          enable-command-block=true
          server-port=25565
          motd=Servidor Minecraft
          view-distance=8
          simulation-distance=6
          PROPERTIES
          fi

          if [[ ! -f eula.txt ]]; then
            echo "eula=true" > eula.txt
          else
            sed -i 's/^eula=false$/eula=true/' eula.txt
          fi

          echo "Configurações preparadas."

      - name: Iniciar agente Playit
        shell: bash
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          set -Eeuo pipefail

          if [[ -z "${PLAYIT_SECRET:-}" ]]; then
            echo "::error::O segredo PLAYIT_SECRET está vazio."
            exit 1
          fi

          docker pull ghcr.io/playit-cloud/playit-agent:latest

          docker rm -f playit-agent >/dev/null 2>&1 || true

          docker run -d \
            --name playit-agent \
            --network host \
            --restart unless-stopped \
            -e SECRET="$PLAYIT_SECRET" \
            ghcr.io/playit-cloud/playit-agent:latest

          sleep 5
          docker ps --filter name=playit-agent

      - name: Iniciar servidor e manter backups
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$GITHUB_WORKSPACE/$SERVER_DIR"

          java -Xms2G -Xmx8G -jar paper.jar --nogui \
            > "$GITHUB_WORKSPACE/$SERVER_DIR/server.log" 2>&1 &

          SERVER_PID=$!
          echo "$SERVER_PID" > /tmp/minecraft-server.pid

          START_TIME="$(date +%s)"
          MAX_RUNTIME=$((325 * 60))

          backup_server() {
            local stamp
            stamp="$(date -u +%Y%m%d-%H%M%S)"

            echo "Criando backup às $stamp..."

            local archive="$GITHUB_WORKSPACE/server-backup-latest.tar.gz"
            local tar_status=0

            set +e
            tar \
              --warning=no-file-changed \
              --ignore-failed-read \
              -czf "$archive" \
              -C "$GITHUB_WORKSPACE" "$SERVER_DIR"
            tar_status=$?
            set -e

            if [[ ! -s "$archive" ]] || ! gzip -t "$archive"; then
              echo "::error::O arquivo de backup não passou na validação."
              return 1
            fi

            if [[ "$tar_status" -ne 0 ]]; then
              echo "::warning::O tar reportou arquivos alterados durante a leitura; o arquivo foi validado, mas pode não representar um estado perfeitamente consistente."
            fi

            if rclone copyto \
              "gdrive2:server-backup-latest.tar.gz" \
              "gdrive2:server-backup-previous.tar.gz" \
              --retries 2 --low-level-retries 3; then
              echo "Backup anterior preservado."
            else
              echo "Ainda não havia backup anterior para copiar."
            fi

            rclone copyto "$archive" \
              "gdrive2:server-backup-latest.tar.gz" \
              --retries 3 --low-level-retries 5

            echo "Backup enviado ao Google Drive."
          }

          echo "Aguardando o servidor iniciar..."
          sleep 120

          if ! kill -0 "$SERVER_PID" 2>/dev/null; then
            echo "::error::O servidor encerrou durante a inicialização."
            tail -n 150 "$GITHUB_WORKSPACE/$SERVER_DIR/server.log" || true
            exit 1
          fi

          backup_server

          while true; do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "::error::O processo do Minecraft foi encerrado inesperadamente."
              tail -n 150 "$GITHUB_WORKSPACE/$SERVER_DIR/server.log" || true
              backup_server || true
              exit 1
            fi

            NOW="$(date +%s)"
            ELAPSED=$((NOW - START_TIME))

            if (( ELAPSED >= MAX_RUNTIME )); then
              echo "Tempo de execução concluído. Preparando o backup final."
              break
            fi

            sleep 600

            if kill -0 "$SERVER_PID" 2>/dev/null; then
              backup_server
            fi
          done

          backup_server

          echo "Encerrando o servidor..."
          kill "$SERVER_PID" 2>/dev/null || true

          for _ in {1..30}; do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          kill -9 "$SERVER_PID" 2>/dev/null || true

          echo "Servidor encerrado. Backup final enviado."
      
      - name: Diagnóstico em caso de falha
        if: ${{ failure() }}
        shell: bash
        run: |
          echo "===== PROCESSOS ====="
          ps aux | grep -E 'java|playit' | grep -v grep || true

          echo "===== LOG DO MINECRAFT ====="
          if [[ -f minecraft/server.log ]]; then
            tail -n 200 minecraft/server.log || true
          fi

          echo "===== LOG DO PLAYIT ====="
          docker logs --tail 100 playit-agent 2>&1 || true

          echo "===== ARQUIVOS DO SERVIDOR ====="
          find minecraft -maxdepth 2 -type f \
            \( -name '*.jar' -o -name 'server.properties' -o -name 'eula.txt' \) \
            -print 2>/dev/null || true
