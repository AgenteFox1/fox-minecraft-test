name: Minecraft Test

on:
  workflow_dispatch:

jobs:
  minecraft:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # JAVA
      # ==========================================

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'


      # ==========================================
      # PAPER
      # ==========================================

      - name: Baixar Paper 1.21.11
        run: |
          mkdir -p minecraft
          cd minecraft

          echo "========================================"
          echo "BAIXANDO PAPER 1.21.11"
          echo "========================================"

          RESPONSE=$(curl -fsSL \
            -H "User-Agent: fox-minecraft-test/1.0" \
            "https://fill.papermc.io/v3/projects/paper/versions/1.21.11/builds")

          DOWNLOAD_URL=$(echo "$RESPONSE" | \
            jq -r 'map(select(.channel == "STABLE")) | .[0].downloads["server:default"].url')

          echo ""
          echo "Download:"
          echo "$DOWNLOAD_URL"

          curl -fL \
            -H "User-Agent: fox-minecraft-test/1.0" \
            -o paper.jar \
            "$DOWNLOAD_URL"

          echo ""
          echo "Paper baixado:"

          ls -lh paper.jar


      # ==========================================
      # EULA
      # ==========================================

      - name: Aceitar EULA
        run: |
          echo "eula=true" > minecraft/eula.txt


      # ==========================================
      # GDOWN
      # ==========================================

      - name: Instalar gdown
        run: |
          echo "========================================"
          echo "INSTALANDO GDOWN"
          echo "========================================"

          python3 -m pip install --upgrade pip
          python3 -m pip install gdown

          echo ""
          echo "Versao do gdown:"

          gdown --version


      # ==========================================
      # MAPAS
      # ==========================================

      - name: Baixar mapas do Google Drive
        run: |
          echo "========================================"
          echo "BAIXANDO MAPAS"
          echo "========================================"

          mkdir -p minecraft

          echo ""
          echo "Baixando Overworld..."

          gdown \
            "https://drive.google.com/uc?id=1Mf7FoRa_P9Q9idPExaTa6S1hQz5sPbT-" \
            -O minecraft/world.zip

          echo ""
          echo "Baixando Nether..."

          gdown \
            "https://drive.google.com/uc?id=1TDVch0u3PyuYrYtTTIYsroJm5dcQNrQM" \
            -O minecraft/world_nether.zip

          echo ""
          echo "Baixando The End..."

          gdown \
            "https://drive.google.com/uc?id=1SMTsfqiLlW3R3FpcgfQYZSNwhBw0JJgt" \
            -O minecraft/world_the_end.zip

          echo ""
          echo "========================================"
          echo "MAPAS BAIXADOS"
          echo "========================================"

          ls -lh minecraft/*.zip


      # ==========================================
      # INSTALAR MAPAS
      # ==========================================

      - name: Instalar mapas
        run: |
          echo "========================================"
          echo "INSTALANDO MAPAS"
          echo "========================================"

          cd minecraft

          rm -rf world world_nether world_the_end

          echo ""
          echo "Extraindo Overworld..."

          unzip -q world.zip

          echo ""
          echo "Extraindo Nether..."

          unzip -q world_nether.zip

          echo ""
          echo "Extraindo The End..."

          unzip -q world_the_end.zip

          echo ""
          echo "Removendo ZIPs..."

          rm world.zip
          rm world_nether.zip
          rm world_the_end.zip

          echo ""
          echo "========================================"
          echo "MUNDOS INSTALADOS"
          echo "========================================"

          echo ""
          echo "Overworld:"
          du -sh world

          echo ""
          echo "Nether:"
          du -sh world_nether

          echo ""
          echo "The End:"
          du -sh world_the_end


      # ==========================================
      # PLAYERDATA
      # ==========================================

      - name: Baixar PlayerData do Google Drive
        run: |
          echo "========================================"
          echo "BAIXANDO PLAYERDATA"
          echo "========================================"

          mkdir -p minecraft

          PLAYERDATA_ID="1LXkLNo6voDQb_T7rafrKv6R6MBomPfRv"

          echo ""
          echo "ID:"
          echo "$PLAYERDATA_ID"

          echo ""
          echo "Baixando..."

          gdown \
            "$PLAYERDATA_ID" \
            -O minecraft/playerdata.gz

          echo ""
          echo "========================================"
          echo "ARQUIVO RECEBIDO"
          echo "========================================"

          ls -lh minecraft/playerdata.gz

          echo ""
          echo "Tipo:"

          file minecraft/playerdata.gz


      # ==========================================
      # INSTALAR PLAYERDATA
      # ==========================================

      - name: Instalar PlayerData
        run: |
          echo "========================================"
          echo "INSTALANDO PLAYERDATA"
          echo "========================================"

          cd minecraft

          echo ""
          echo "Arquivo recebido:"

          file playerdata.gz

          ls -lh playerdata.gz

          echo ""
          echo "========================================"
          echo "VALIDANDO GZIP"
          echo "========================================"

          if ! gzip -t playerdata.gz; then
            echo ""
            echo "ERRO: O PLAYERDATA NAO E UM GZIP VALIDO."
            exit 1
          fi

          echo ""
          echo "GZIP VALIDO!"

          echo ""
          echo "========================================"
          echo "DESCOMPACTANDO PLAYERDATA"
          echo "========================================"

          rm -rf playerdata_temp

          mkdir playerdata_temp

          gzip -dc playerdata.gz > playerdata_temp/playerdata.dat

          echo ""
          echo "Arquivo descompactado:"

          ls -lh playerdata_temp/playerdata.dat

          echo ""
          echo "Tipo:"

          file playerdata_temp/playerdata.dat

          echo ""
          echo "========================================"
          echo "PROCURANDO UUID NO NOME ORIGINAL"
          echo "========================================"

          echo ""
          echo "Informacoes do GZIP:"

          gzip -lv playerdata.gz || true

          echo ""
          echo "========================================"
          echo "ARQUIVOS DAT ENCONTRADOS"
          echo "========================================"

          find playerdata_temp -type f -name "*.dat" -print

          echo ""
          echo "========================================"
          echo "INSTALANDO PLAYERDATA"
          echo "========================================"

          mkdir -p world/playerdata

          DAT_FILE=$(find playerdata_temp -type f -name "*.dat" | head -1)

          if [ -z "$DAT_FILE" ]; then

            echo ""
            echo "ERRO: NENHUM ARQUIVO .DAT FOI ENCONTRADO."

            exit 1

          fi

          echo ""
          echo "Arquivo encontrado:"
          echo "$DAT_FILE"

          echo ""
          echo "Nome:"
          basename "$DAT_FILE"

          echo ""
          echo "========================================"
          echo "VERIFICANDO NOME DO PLAYERDATA"
          echo "========================================"

          DAT_NAME=$(basename "$DAT_FILE")

          echo ""
          echo "Nome do arquivo:"
          echo "$DAT_NAME"

          # Se o arquivo ja tiver um nome UUID.dat,
          # usamos esse nome diretamente.
          if [[ "$DAT_NAME" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}\.dat$ ]]; then

            echo ""
            echo "UUID encontrado no nome do arquivo!"

            cp -av "$DAT_FILE" "world/playerdata/$DAT_NAME"

          else

            echo ""
            echo "O arquivo nao possui nome UUID."
            echo ""
            echo "PlayerData descompactado:"
            ls -lah "$DAT_FILE"
            echo ""
            echo "O arquivo precisa ser associado ao UUID do jogador."
            echo ""
            echo "NAO VAMOS COLOCAR UM NOME ERRADO AUTOMATICAMENTE."

            exit 1

          fi

          echo ""
          echo "========================================"
          echo "PLAYERDATA INSTALADO"
          echo "========================================"

          echo ""
          echo "Arquivos em world/playerdata:"

          ls -lah world/playerdata

          echo ""
          echo "Quantidade de .dat:"

          find world/playerdata -type f -name "*.dat" | wc -l

          echo ""
          echo "========================================"

          rm -rf playerdata_temp
          rm -f playerdata.gz

          echo ""
          echo "Temporarios removidos."

          echo ""
          echo "========================================"
          echo "PLAYERDATA FINALIZADO"
          echo "========================================"


      # ==========================================
      # PLAYIT
      # ==========================================

      - name: Iniciar Playit
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          echo "========================================"
          echo "INICIANDO PLAYIT"
          echo "========================================"

          docker rm -f playit 2>/dev/null || true

          docker run \
            -d \
            --name playit \
            --network host \
            --restart unless-stopped \
            -e SECRET_KEY="$PLAYIT_SECRET" \
            ghcr.io/playit-cloud/playit-agent:latest

          echo ""
          echo "Aguardando Playit..."

          sleep 10

          echo ""
          echo "========================================"
          echo "LOG DO PLAYIT"
          echo "========================================"

          docker logs playit


      # ==========================================
      # VERIFICAR PLAYIT
      # ==========================================

      - name: Verificar Playit
        run: |
          echo "========================================"
          echo "STATUS DO PLAYIT"
          echo "========================================"

          docker ps --filter "name=playit"

          echo ""
          echo "Logs recentes:"

          docker logs --tail 50 playit

          echo ""
          echo "========================================"


      # ==========================================
      # INICIAR MINECRAFT
      # ==========================================

      - name: Iniciar Minecraft
        run: |
          cd minecraft

          echo "========================================"
          echo "INICIANDO MINECRAFT"
          echo "========================================"

          echo ""
          echo "Java:"

          java -version

          echo ""
          echo "Mundos:"

          du -sh world world_nether world_the_end

          echo ""
          echo "PlayerData:"

          if [ -d "world/playerdata" ]; then

            ls -lah world/playerdata

            echo ""
            echo "Arquivos .dat:"

            find world/playerdata -type f -name "*.dat" | wc -l

          else

            echo "Nenhuma pasta playerdata encontrada."

          fi

          echo ""
          echo "========================================"
          echo "SERVIDOR INICIANDO"
          echo "========================================"

          java \
            -Xms2G \
            -Xmx8G \
            -jar paper.jar \
            nogui


      # ==========================================
      # LOG FINAL DO PLAYIT
      # ==========================================

      - name: Mostrar logs do Playit
        if: always()
        run: |
          echo "========================================"
          echo "LOG FINAL DO PLAYIT"
          echo "========================================"

          docker logs playit || true

          echo ""
          echo "========================================"
          echo "FIM DO WORKFLOW"
          echo "========================================"
