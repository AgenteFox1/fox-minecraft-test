name: Minecraft Test

on:
  workflow_dispatch:

jobs:
  minecraft:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # JAVA
      # ============================================================

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # ============================================================
      # PAPER
      # ============================================================

      - name: Baixar Paper 1.21.11
        run: |
          mkdir -p minecraft
          cd minecraft

          echo "Consultando builds do Paper..."

          RESPONSE=$(curl -fsSL \
            -H "User-Agent: fox-minecraft-test/1.0" \
            "https://fill.papermc.io/v3/projects/paper/versions/1.21.11/builds")

          DOWNLOAD_URL=$(echo "$RESPONSE" | \
            jq -r 'map(select(.channel == "STABLE")) | .[0].downloads["server:default"].url')

          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "ERRO: Não foi possível encontrar o download do Paper."
            exit 1
          fi

          echo "Download:"
          echo "$DOWNLOAD_URL"

          curl -fL \
            -H "User-Agent: fox-minecraft-test/1.0" \
            -o paper.jar \
            "$DOWNLOAD_URL"

          echo "Paper baixado:"
          ls -lh paper.jar

      # ============================================================
      # EULA
      # ============================================================

      - name: Aceitar EULA
        run: |
          echo "eula=true" > minecraft/eula.txt

      # ============================================================
      # FERRAMENTAS
      # ============================================================

      - name: Instalar ferramentas
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install gdown
          python3 -m pip install nbtlib

          echo "gdown:"
          gdown --version

          echo "nbtlib:"
          python3 -c "import nbtlib; print(nbtlib.__version__)"

          echo "unzip:"
          unzip -v | head -n 2

      # ============================================================
      # MAPAS
      # ============================================================

      - name: Baixar mapas do Google Drive
        run: |
          mkdir -p minecraft

          echo "Baixando mundo principal..."
          gdown \
            "https://drive.google.com/uc?id=1Mf7FoRa_P9Q9idPExaTa6S1hQz5sPbT-" \
            -O minecraft/world.zip

          echo "Baixando Nether..."
          gdown \
            "https://drive.google.com/uc?id=1TDVch0u3PyuYrYtTTIYsroJm5dcQNrQM" \
            -O minecraft/world_nether.zip

          echo "Baixando End..."
          gdown \
            "https://drive.google.com/uc?id=1SMTsfqiLlW3R3FpcgfQYZSNwhBw0JJgt" \
            -O minecraft/world_the_end.zip

          echo "Arquivos baixados:"
          ls -lh minecraft/*.zip

      - name: Instalar mapas
        run: |
          cd minecraft

          echo "Removendo mundos antigos..."
          rm -rf world world_nether world_the_end

          echo "Extraindo mundo principal..."
          unzip -q world.zip

          echo "Extraindo Nether..."
          unzip -q world_nether.zip

          echo "Extraindo End..."
          unzip -q world_the_end.zip

          rm -f world.zip
          rm -f world_nether.zip
          rm -f world_the_end.zip

          echo "Tamanho dos mundos:"
          du -sh world world_nether world_the_end

      # ============================================================
      # PLUGINS
      # ============================================================

      - name: Baixar plugins do Google Drive
        run: |
          mkdir -p minecraft

          PLUGINS_ID="1Xfk68Fgf6hRhLJJ1ln5Jf2gKLeJ_n6iV"

          echo "Baixando ZIP dos plugins..."
          echo "ID: $PLUGINS_ID"

          gdown \
            "https://drive.google.com/uc?id=$PLUGINS_ID" \
            -O minecraft/plugins.zip

          echo "Arquivo recebido:"
          ls -lh minecraft/plugins.zip

          echo "Tipo do arquivo:"
          file minecraft/plugins.zip

          echo "Testando ZIP..."
          unzip -t minecraft/plugins.zip

      - name: Instalar plugins e configurações
        run: |
          cd minecraft

          echo "=========================================="
          echo "INSTALAÇÃO DOS PLUGINS"
          echo "=========================================="

          rm -rf plugins_temp
          mkdir -p plugins_temp
          mkdir -p plugins

          echo "Extraindo ZIP..."
          unzip -q plugins.zip -d plugins_temp

          echo ""
          echo "Conteúdo recebido:"
          find plugins_temp -maxdepth 3 -print | sort

          echo ""
          echo "Verificando estrutura..."

          # --------------------------------------------------------
          # Caso 1:
          #
          # plugins.zip
          # └── plugins/
          #     ├── plugin.jar
          #     └── plugin/
          #
          # --------------------------------------------------------

          if [ -d "plugins_temp/plugins" ]; then

            echo "Estrutura detectada: plugins/"

            cp -a plugins_temp/plugins/. plugins/

          else

            # ------------------------------------------------------
            # Caso 2:
            #
            # plugins.zip
            # ├── plugin.jar
            # ├── plugin/
            # └── ...
            #
            # ------------------------------------------------------

            echo "Estrutura detectada: conteúdo direto."

            cp -a plugins_temp/. plugins/

          fi

          echo ""
          echo "=========================================="
          echo "PLUGINS INSTALADOS"
          echo "=========================================="

          echo ""
          echo "JARs:"
          find plugins -maxdepth 1 -type f -name "*.jar" \
            -printf "%f\n" | sort

          echo ""
          echo "Pastas de configuração:"
          find plugins -mindepth 1 -maxdepth 1 -type d \
            -printf "%f\n" | sort

          echo ""
          echo "Quantidade de JARs:"
          PLUGIN_COUNT=$(find plugins -maxdepth 1 -type f -name "*.jar" | wc -l)
          echo "$PLUGIN_COUNT"

          echo ""
          echo "Tamanho da pasta plugins:"
          du -sh plugins

          # --------------------------------------------------------
          # NÃO removemos as configurações.
          # Apenas removemos os arquivos temporários.
          # --------------------------------------------------------

          rm -rf plugins_temp
          rm -f plugins.zip

          echo ""
          echo "Instalação concluída."

      # ============================================================
      # PLAYERDATA
      # ============================================================

      - name: Baixar PlayerData do Google Drive
        run: |
          mkdir -p minecraft

          PLAYERDATA_ID="1LXkLNo6voDQb_T7rafrKv6R6MBomPfRv"

          echo "Baixando PlayerData..."

          gdown \
            "https://drive.google.com/uc?id=$PLAYERDATA_ID" \
            -O minecraft/playerdata.gz

          echo ""
          echo "Arquivo:"
          ls -lh minecraft/playerdata.gz

          echo ""
          echo "Tipo:"
          file minecraft/playerdata.gz

      - name: Instalar PlayerData
        run: |
          cd minecraft

          echo "=========================================="
          echo "PLAYERDATA"
          echo "=========================================="

          if ! gzip -t playerdata.gz; then
            echo "ERRO: GZIP INVALIDO."
            exit 1
          fi

          echo "GZIP válido."

          gzip -dc playerdata.gz > playerdata.dat

          echo "Arquivo descompactado:"
          ls -lh playerdata.dat

          python3 << 'PY'
          import nbtlib
          import uuid
          import os
          import shutil

          source = "playerdata.dat"
          output_dir = "world/playerdata"

          print("Lendo PlayerData NBT...")

          try:
              nbt = nbtlib.load(source, gzipped=False)
          except Exception as e:
              print("ERRO AO LER NBT:", e)
              raise SystemExit(1)

          print("")
          print("Tags encontradas:")

          for key in nbt.keys():
              print(" -", key)

          found_uuid = None

          # UUID moderno
          if "UUID" in nbt:
              value = nbt["UUID"]

              try:
                  values = [int(x) for x in value]

                  if len(values) == 4:
                      raw = b"".join(
                          int(x & 0xffffffff).to_bytes(
                              4,
                              byteorder="big",
                              signed=False
                          )
                          for x in values
                      )

                      found_uuid = str(uuid.UUID(bytes=raw))

              except Exception as e:
                  print("Erro ao converter UUID:", e)

          # UUID antigo
          if found_uuid is None:

              if "UUIDMost" in nbt and "UUIDLeast" in nbt:

                  most = int(nbt["UUIDMost"])
                  least = int(nbt["UUIDLeast"])

                  most &= (1 << 64) - 1
                  least &= (1 << 64) - 1

                  raw = (
                      most.to_bytes(8, byteorder="big") +
                      least.to_bytes(8, byteorder="big")
                  )

                  found_uuid = str(uuid.UUID(bytes=raw))

          if found_uuid is None:
              print("UUID NAO ENCONTRADO")
              raise SystemExit(1)

          print("")
          print("UUID encontrado:")
          print(found_uuid)

          # Verificação do Ender Chest
          if "EnderItems" in nbt:

              ender = nbt["EnderItems"]

              print("")
              print("EnderItems encontrado.")
              print("Quantidade de itens no Ender Chest:", len(ender))

          else:

              print("")
              print("AVISO: EnderItems não encontrado no PlayerData.")

          os.makedirs(output_dir, exist_ok=True)

          destination = os.path.join(
              output_dir,
              found_uuid + ".dat"
          )

          shutil.copyfile(
              source,
              destination
          )

          print("")
          print("PLAYERDATA INSTALADO:")
          print(destination)

          PY

          echo ""
          echo "PlayerData instalado:"
          ls -lah world/playerdata

          echo ""
          echo "Arquivos:"
          find world/playerdata \
            -type f \
            -name "*.dat" \
            -print

          echo ""
          echo "Quantidade:"
          find world/playerdata \
            -type f \
            -name "*.dat" | wc -l

          rm -f playerdata.dat
          rm -f playerdata.gz

      # ============================================================
      # PLAYIT
      # ============================================================

      - name: Iniciar Playit
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          echo "=========================================="
          echo "INICIANDO PLAYIT"
          echo "=========================================="

          docker rm -f playit 2>/dev/null || true

          docker run \
            -d \
            --name playit \
            --network host \
            --restart unless-stopped \
            -e SECRET_KEY="$PLAYIT_SECRET" \
            ghcr.io/playit-cloud/playit-agent:latest

          echo "Aguardando Playit..."
          sleep 10

          echo ""
          echo "Logs do Playit:"
          docker logs playit

      # ============================================================
      # VERIFICAR PLAYIT
      # ============================================================

      - name: Verificar Playit
        run: |
          echo "Container:"
          docker ps --filter "name=playit"

          echo ""
          echo "Últimos logs:"
          docker logs --tail 50 playit

      # ============================================================
      # VERIFICAR PLUGINS
      # ============================================================

      - name: Verificar plugins antes de iniciar
        run: |
          cd minecraft

          echo "=========================================="
          echo "VERIFICAÇÃO FINAL DOS PLUGINS"
          echo "=========================================="

          echo ""
          echo "Arquivos JAR:"
          find plugins \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            -printf "%f\n" | sort

          echo ""
          echo "Total de JARs:"

          PLUGIN_COUNT=$(find plugins \
            -maxdepth 1 \
            -type f \
            -name "*.jar" | wc -l)

          echo "$PLUGIN_COUNT"

          if [ "$PLUGIN_COUNT" -eq 0 ]; then
            echo ""
            echo "ERRO: NENHUM PLUGIN FOI ENCONTRADO!"
            echo ""
            echo "Conteúdo da pasta plugins:"
            find plugins -maxdepth 3 -print
            exit 1
          fi

          echo ""
          echo "Pastas de configuração:"
          find plugins \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -printf "%f\n" | sort

          echo ""
          echo "Tamanho:"
          du -sh plugins

      # ============================================================
      # INICIAR MINECRAFT
      # ============================================================

      - name: Iniciar Minecraft
        run: |
          cd minecraft

          echo "=========================================="
          echo "INICIANDO MINECRAFT"
          echo "=========================================="

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Paper:"
          ls -lh paper.jar

          echo ""
          echo "Plugins:"
          find plugins \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            -printf "%f\n" | sort

          echo ""
          echo "Mundos:"
          du -sh world world_nether world_the_end

          echo ""
          echo "PlayerData:"
          if [ -d "world/playerdata" ]; then
            ls -lah world/playerdata
            find world/playerdata \
              -type f \
              -name "*.dat" \
              -print
          else
            echo "Nenhuma pasta playerdata encontrada."
          fi

          echo ""
          echo "=========================================="
          echo "PAPER INICIANDO"
          echo "=========================================="

          java \
            -Xms2G \
            -Xmx8G \
            -jar paper.jar \
            nogui

      # ============================================================
      # LOGS PLAYIT
      # ============================================================

      - name: Mostrar logs do Playit
        if: always()
        run: |
          echo "=========================================="
          echo "LOGS FINAIS DO PLAYIT"
          echo "=========================================="

          docker logs playit || true
