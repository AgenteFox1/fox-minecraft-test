
name: Minecraft Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minecraft-test-server
  cancel-in-progress: false

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
      PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}

      PLUGIN_ZIP_ID: "14OF6wa80pT4VOJch7-8kdvs42jRnCj78"

      WORLD_ZIP_ID: "1Mf7FoRa_P9Q9idPExaTa6S1hQz5sPbT-"
      NETHER_ZIP_ID: "1TDVch0u3PyuYrYtTTIYsroJm5dcQNrQM"
      END_ZIP_ID: "1SMTsfqiLlW3R3FpcgfQYZSNwhBw0JJgt"

    steps:
      - name: Preparar Java, ferramentas e diretórios
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            openjdk-21-jre-headless \
            curl \
            jq \
            unzip \
            tar \
            gzip \
            coreutils \
            rclone

          mkdir -p minecraft/plugins
          mkdir -p downloads
          mkdir -p logs

          java -version
          rclone version

      - name: Configurar autenticação do Google Drive
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -z "${RCLONE_CONFIG_B64:-}" ]]; then
            echo "::error::O secret RCLONE_CONFIG_B64 está vazio."
            exit 1
          fi

          mkdir -p "$HOME/.config/rclone"

          printf '%s' "$RCLONE_CONFIG_B64" \
            | base64 --decode \
            > "$HOME/.config/rclone/rclone.conf"

          chmod 600 "$HOME/.config/rclone/rclone.conf"

          if [[ -n "${GDRIVE_FOLDER_ID:-}" ]]; then
            echo "RCLONE_CONFIG_GDRIVE2_ROOT_FOLDER_ID=$GDRIVE_FOLDER_ID" \
              >> "$GITHUB_ENV"
          fi

          echo "Testando acesso ao Google Drive..."

          if ! timeout 45s rclone lsf gdrive2: \
              --max-depth 1 \
              2> >(sed -E \
                's/(access_token|refresh_token|client_secret|token)[=:][^,} ]+/\1=[REDACTED]/Ig' \
                >&2); then
            echo "::error::Não foi possível acessar o Google Drive. Verifique RCLONE_CONFIG_B64, a autenticação e GDRIVE_FOLDER_ID."
            exit 1
          fi

          echo "Google Drive acessível."

      - name: Baixar backup completo do servidor
        id: backup
        shell: bash
        run: |
          set -Eeuo pipefail

          cd downloads

          echo "Procurando server-backup-latest.tar.gz no Google Drive..."

          if timeout 120s rclone copyto \
              "gdrive2:server-backup-latest.tar.gz" \
              "server-backup-latest.tar.gz" \
              --retries 3 \
              --low-level-retries 5; then

            if tar -tzf server-backup-latest.tar.gz >/dev/null; then
              echo "Backup completo encontrado e validado."
              echo "available=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::O arquivo server-backup-latest.tar.gz foi baixado, mas não é um arquivo TAR.GZ válido."
              exit 1
            fi
          else
            echo "Não foi possível baixar o backup mais recente."
            echo "O workflow tentará restaurar os mundos pelos ZIPs individuais."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restaurar backup completo
        if: steps.backup.outputs.available == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p minecraft

          echo "Extraindo backup sem apagar arquivos existentes..."

          tar \
            --no-same-owner \
            -xzf downloads/server-backup-latest.tar.gz \
            -C minecraft

          echo "Conteúdo restaurado:"
          find minecraft -maxdepth 2 -type d | sort | head -200

          for world in world world_nether world_the_end; do
            if [[ -d "minecraft/$world" ]]; then
              echo "Mundo restaurado: $world"
            else
              echo "Aviso: $world não foi encontrado no backup."
            fi
          done

      - name: Restaurar mundos pelos ZIPs individuais se necessário
        if: steps.backup.outputs.available != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          download_drive_file() {
            local file_id="$1"
            local output="$2"

            echo "Baixando arquivo do Drive: $output"

            rclone copyid "$file_id" "$PWD/downloads/$output" \
              --retries 3 \
              --low-level-retries 5

            test -s "downloads/$output"
            unzip -t "downloads/$output" >/dev/null
          }

          restore_world() {
            local file_id="$1"
            local world_name="$2"
            local zip_file="$3"

            download_drive_file "$file_id" "$zip_file"

            mkdir -p "minecraft/$world_name"

            unzip -oq "downloads/$zip_file" \
              -d "minecraft/$world_name"

            echo "Mundo restaurado: $world_name"
          }

          restore_world "$WORLD_ZIP_ID" \
            "world" "world.zip"

          restore_world "$NETHER_ZIP_ID" \
            "world_nether" "world_nether.zip"

          restore_world "$END_ZIP_ID" \
            "world_the_end" "world_the_end.zip"

      - name: Baixar e restaurar o ZIP de plugins do Drive
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Baixando o pacote de plugins..."

          rclone copyid "$PLUGIN_ZIP_ID" \
            "$PWD/downloads/plugins-drive.zip" \
            --retries 3 \
            --low-level-retries 5

          test -s downloads/plugins-drive.zip

          if ! unzip -t downloads/plugins-drive.zip >/dev/null; then
            echo "::error::O ZIP de plugins baixado está inválido."
            exit 1
          fi

          mkdir -p downloads/plugins-extraidos
          unzip -oq downloads/plugins-drive.zip \
            -d downloads/plugins-extraidos

          mkdir -p minecraft/plugins

          # Copia os JARs mesmo se estiverem em subpastas do ZIP.
          # Não apaga os diretórios de configuração já restaurados.
          mapfile -d '' plugin_jars < <(
            find downloads/plugins-extraidos \
              -type f -iname '*.jar' -print0
          )

          if (( ${#plugin_jars[@]} == 0 )); then
            echo "::error::Nenhum arquivo .jar foi encontrado dentro do ZIP de plugins."
            echo "Estrutura do ZIP:"
            find downloads/plugins-extraidos -maxdepth 4 -type f | head -200
            exit 1
          fi

          for jar in "${plugin_jars[@]}"; do
            filename="$(basename "$jar")"
            cp -f "$jar" "minecraft/plugins/$filename"
            echo "Plugin instalado: $filename"
          done

          echo
          echo "Total de arquivos JAR copiados: ${#plugin_jars[@]}"
          echo "Plugins finais:"
          find minecraft/plugins -maxdepth 1 -type f -iname '*.jar' \
            -printf '%f\n' | sort

      - name: Baixar Paper 1.21.11
        shell: bash
        run: |
          set -Eeuo pipefail

          cd minecraft

          API="https://fill.papermc.io/v3/projects/paper/versions/1.21.11/builds"

          echo "Consultando builds estáveis do Paper..."

          response="$(curl -fsSL \
            -H "User-Agent: OdisseiaMinecraftServer/1.0" \
            "$API")"

          BUILD="$(
            printf '%s' "$response" \
              | jq -r '
                  if type == "array" then
                    [.[] | select((.channel // "") == "STABLE")][0].id // empty
                  else
                    empty
                  end
                '
          )"

          if [[ -z "$BUILD" ]]; then
            echo "::error::A API do Paper não retornou uma build estável para 1.21.11."
            printf '%s\n' "$response" | jq '.[0:3]' || true
            exit 1
          fi

          echo "Build selecionada: $BUILD"

          BUILD_INFO="$(curl -fsSL \
            -H "User-Agent: OdisseiaMinecraftServer/1.0" \
            "$API/$BUILD")"

          DOWNLOAD_URL="$(
            printf '%s' "$BUILD_INFO" \
              | jq -r '
                  .. | objects
                  | select(."downloads" != null)
                  | ."downloads".["server:default"].url // empty
                ' | head -n 1
          )"

          if [[ -z "$DOWNLOAD_URL" ]]; then
            DOWNLOAD_URL="$(
              printf '%s' "$BUILD_INFO" \
                | jq -r '.. | objects | .url? // empty' \
                | grep -E '\.jar($|\?)' \
                | head -n 1 || true
            )"
          fi

          if [[ -z "$DOWNLOAD_URL" ]]; then
            echo "::error::Não foi possível localizar o download do JAR do Paper."
            printf '%s\n' "$BUILD_INFO" | jq .
            exit 1
          fi

          curl -fL --retry 3 \
            "$DOWNLOAD_URL" \
            -o paper.jar

          test -s paper.jar

          echo "Paper baixado:"
          ls -lh paper.jar

      - name: Preparar configurações de inicialização
        shell: bash
        run: |
          set -Eeuo pipefail

          cd minecraft

          if [[ ! -f eula.txt ]]; then
            echo "eula=true" > eula.txt
          fi

          # Mantém o arquivo restaurado se ele já existir.
          if [[ ! -f server.properties ]]; then
            cat > server.properties <<'PROPERTIES'
          server-port=25565
          online-mode=false
          enable-command-block=true
          motd=Servidor Minecraft
          view-distance=8
          simulation-distance=6
          max-players=20
          PROPERTIES
          fi

          if [[ ! -f start.sh ]]; then
            cat > start.sh <<'START'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          exec java -Xms2G -Xmx8G -jar paper.jar --nogui
          START
          fi

          chmod +x start.sh

          echo "Verificando mundos e plugins antes de iniciar..."

          for world in world world_nether world_the_end; do
            if [[ -d "$world" ]]; then
              echo "OK: $world"
            else
              echo "Aviso: diretório $world não existe."
            fi
          done

          echo "JARs encontrados: $(find plugins -maxdepth 1 -type f -iname '*.jar' | wc -l)"

      - name: Iniciar Playit
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -z "${PLAYIT_SECRET:-}" ]]; then
            echo "::error::O secret PLAYIT_SECRET está vazio."
            exit 1
          fi

          docker version

          docker run -d \
            --name playit-agent \
            --restart unless-stopped \
            --network host \
            -e SECRET="$PLAYIT_SECRET" \
            ghcr.io/playit-cloud/playit-agent:latest

          sleep 5
          docker logs --tail 50 playit-agent || true

      - name: Iniciar servidor e fazer backups periódicos
        shell: bash
        run: |
          set -Eeuo pipefail

          cd minecraft

          # Executa o servidor em segundo plano para permitir os backups.
          bash start.sh > ../logs/server.log 2>&1 &
          SERVER_PID=$!

          cleanup() {
            echo "Encerrando o servidor..."

            if kill -0 "$SERVER_PID" 2>/dev/null; then
              kill -TERM "$SERVER_PID" 2>/dev/null || true
              sleep 10
              kill -KILL "$SERVER_PID" 2>/dev/null || true
            fi

            docker stop playit-agent >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          backup_server() {
            local stamp
            stamp="$(date -u +%Y%m%d-%H%M%S)"
            local archive="../downloads/server-backup-${stamp}.tar.gz"
            local temp_archive="${archive}.tmp"

            echo "Criando backup em $stamp..."

            # O servidor pode alterar arquivos durante o tar.
            # A validade real do arquivo é verificada antes do upload.
            set +e
            tar --warning=no-file-changed \
              -czf "$temp_archive" \
              --exclude='./logs' \
              --exclude='./cache' \
              --exclude='./downloads' \
              .
            tar_status=$?
            set -e

            if [[ ! -s "$temp_archive" ]]; then
              echo "::warning::O backup ficou vazio; ignorando."
              rm -f "$temp_archive"
              return 1
            fi

            if ! tar -tzf "$temp_archive" >/dev/null; then
              echo "::warning::O backup criado não passou na validação."
              rm -f "$temp_archive"
              return 1
            fi

            mv "$temp_archive" "$archive"

            if (( tar_status != 0 )); then
              echo "::warning::O tar reportou alterações durante a leitura; o arquivo passou na validação."
            fi

            # Mantém o último backup válido como previous.
            if rclone copyto \
                gdrive2:server-backup-latest.tar.gz \
                ../downloads/server-backup-previous.tar.gz \
                --retries 2; then

              rclone copyto \
                ../downloads/server-backup-previous.tar.gz \
                gdrive2:server-backup-previous.tar.gz \
                --retries 2 || true
            fi

            # Atualiza o backup mais recente.
            rclone copyto \
              "$archive" \
              gdrive2:server-backup-latest.tar.gz \
              --retries 3 \
              --low-level-retries 5

            echo "Backup enviado para o Google Drive."
          }

          echo "Aguardando 120 segundos para a inicialização..."
          sleep 120

          if ! kill -0 "$SERVER_PID" 2>/dev/null; then
            echo "::error::O servidor encerrou durante a inicialização."
            tail -n 150 ../logs/server.log || true
            exit 1
          fi

          backup_server || echo "::warning::O backup inicial falhou."

          # O servidor roda por aproximadamente 5h25.
          END_TIME=$(( $(date +%s) + 19500 ))
          NEXT_BACKUP=$(( $(date +%s) + 600 ))

          while kill -0 "$SERVER_PID" 2>/dev/null; do
            NOW="$(date +%s)"

            if (( NOW >= END_TIME )); then
              echo "Tempo de execução atingido."
              break
            fi

            if (( NOW >= NEXT_BACKUP )); then
              backup_server || echo "::warning::Um backup periódico falhou."
              NEXT_BACKUP=$(( $(date +%s) + 600 ))
            fi

            sleep 15
          done

          echo "Criando backup final..."
          backup_server || echo "::warning::O backup final falhou."

          echo "Últimas linhas do log:"
          tail -n 100 ../logs/server.log || true

      - name: Mostrar resumo em caso de falha
        if: failure()
        shell: bash
        run: |
          echo "O workflow falhou. Resumo dos arquivos locais:"
          find minecraft -maxdepth 2 -type f \
            \( -name '*.jar' -o -name 'server.properties' -o -name 'eula.txt' \) \
            -printf '%p (%s bytes)\n' 2>/dev/null | head -200 || true

          echo
          echo "Últimas linhas do log do servidor:"
          tail -n 150 logs/server.log 2>/dev/null || true

          echo
          echo "Logs do Playit:"
          docker logs --tail 80 playit-agent 2>/dev/null || true
