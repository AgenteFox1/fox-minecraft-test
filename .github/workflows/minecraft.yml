
name: Minecraft Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minecraft:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Preparar ambiente
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq unzip tar gzip file coreutils python3-pip

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar ferramentas auxiliares
        run: |
          python3 -m pip install --break-system-packages gdown

      - name: Configurar Google Drive sem autenticação interativa
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${RCLONE_CONFIG_B64:-}" ]; then
            echo "::error::O segredo RCLONE_CONFIG_B64 não está configurado."
            exit 1
          fi

          if [ -z "${GDRIVE_FOLDER_ID:-}" ]; then
            echo "::error::O segredo GDRIVE_FOLDER_ID não está configurado."
            exit 1
          fi

          mkdir -p "$HOME/.config/rclone"

          printf '%s' "$RCLONE_CONFIG_B64" \
            | base64 --decode > "$HOME/.config/rclone/rclone.conf"

          chmod 600 "$HOME/.config/rclone/rclone.conf"

          if ! rclone listremotes | grep -qx 'gdrive2:'; then
            echo "::error::O arquivo rclone.conf não contém o remote gdrive2."
            exit 1
          fi

          # Define a pasta do Drive por variável de ambiente.
          # Não executa 'rclone config update', que pode abrir autenticação.
          export RCLONE_CONFIG_GDRIVE2_ROOT_FOLDER_ID="$GDRIVE_FOLDER_ID"

          echo "Verificando acesso ao Google Drive..."

          if ! timeout 30s rclone lsf gdrive2: --max-depth 1 >/dev/null; then
            echo "::error::Não foi possível acessar o Google Drive. O token OAuth do RCLONE_CONFIG_B64 pode estar inválido ou expirado. Atualize o segredo com um rclone.conf autorizado."
            exit 1
          fi

          echo "Conexão com o Google Drive verificada."

      - name: Baixar Paper 1.21.11
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p minecraft
          cd minecraft

          BUILD="132"
          URL="https://api.papermc.io/v2/projects/paper/versions/1.21.11/builds/${BUILD}/downloads/paper-1.21.11-${BUILD}.jar"

          curl -fL --retry 3 --retry-delay 2 "$URL" -o paper.jar

          if ! file paper.jar | grep -qi 'Java archive'; then
            echo "::error::O arquivo do Paper baixado não parece ser um JAR válido."
            exit 1
          fi

      - name: Restaurar backup mais recente do servidor
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        shell: bash
        run: |
          set -euo pipefail

          export RCLONE_CONFIG_GDRIVE2_ROOT_FOLDER_ID="$GDRIVE_FOLDER_ID"
          mkdir -p minecraft
          cd minecraft

          RESTORED=false

          if timeout 120s rclone copyto \
            gdrive2:server-backup-latest.tar.gz \
            server-backup-latest.tar.gz; then

            if tar -tzf server-backup-latest.tar.gz >/dev/null 2>&1; then
              tar -xzf server-backup-latest.tar.gz
              RESTORED=true
              echo "Backup mais recente restaurado."
            else
              echo "::warning::O backup mais recente não é um TAR.GZ válido."
              rm -f server-backup-latest.tar.gz
            fi
          else
            echo "::warning::Não foi possível baixar o backup mais recente."
          fi

          if [ "$RESTORED" != "true" ]; then
            if timeout 120s rclone copyto \
              gdrive2:server-backup-previous.tar.gz \
              server-backup-previous.tar.gz; then

              if tar -tzf server-backup-previous.tar.gz >/dev/null 2>&1; then
                tar -xzf server-backup-previous.tar.gz
                RESTORED=true
                echo "Backup anterior restaurado."
              else
                echo "::warning::O backup anterior também não é um TAR.GZ válido."
              fi
            fi
          fi

          if [ "$RESTORED" != "true" ]; then
            echo "::warning::Nenhum backup TAR.GZ pôde ser restaurado. Tentando baixar os mundos individualmente."

            mkdir -p world world_nether world_the_end

            python3 -m gdown \
              "https://drive.google.com/uc?id=1Mf7FoRa_P9Q9idPExaTa6S1hQz5sPbT-" \
              -O world.zip || true

            python3 -m gdown \
              "https://drive.google.com/uc?id=1TDVch0u3PyuYrYtTTIYsroJm5dcQNrQM" \
              -O world_nether.zip || true

            python3 -m gdown \
              "https://drive.google.com/uc?id=1SMTsfqiLlW3R3FpcgfQYZSNwhBw0JJgt" \
              -O world_the_end.zip || true

            for ZIP in world.zip world_nether.zip world_the_end.zip; do
              if [ -s "$ZIP" ] && unzip -tq "$ZIP" >/dev/null 2>&1; then
                DEST="${ZIP%.zip}"
                mkdir -p "$DEST"
                unzip -oq "$ZIP" -d "$DEST"
              else
                echo "::warning::Não foi possível restaurar ${ZIP}."
              fi
            done
          fi

      - name: Aceitar EULA
        run: |
          mkdir -p minecraft
          echo "eula=true" > minecraft/eula.txt

      - name: Baixar plugins de fontes oficiais
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        shell: bash
        run: |
          set -euo pipefail

          export RCLONE_CONFIG_GDRIVE2_ROOT_FOLDER_ID="$GDRIVE_FOLDER_ID"

          mkdir -p minecraft/plugins
          cd minecraft/plugins

          download_direct() {
            local name="$1"
            local url="$2"
            local output="$3"
            local temp="${output}.download"

            echo "Tentando baixar ${name}..."

            if curl -fLsS --retry 2 --retry-delay 2 "$url" -o "$temp"; then
              if file "$temp" | grep -qi 'Java archive'; then
                mv "$temp" "$output"
                echo "Plugin instalado: ${name}"
                return 0
              fi
            fi

            rm -f "$temp"
            echo "::warning::Não foi possível baixar ${name}; será mantida a versão existente, se houver."
            return 0
          }

          download_modrinth() {
            local name="$1"
            local slug="$2"
            local output="$3"
            local versions_json
            local download_url
            local temp="${output}.download"

            echo "Consultando versão pública de ${name}..."

            if ! versions_json="$(curl -fLsS --retry 2 \
              "https://api.modrinth.com/v2/project/${slug}/version")"; then
              echo "::warning::Não foi possível consultar ${name} no Modrinth."
              return 0
            fi

            download_url="$(printf '%s' "$versions_json" | jq -r '
              [
                .[]
                | select(any(.game_versions[]?; startswith("1.21")))
              ][0].files[]?
              | select(.primary == true)
              | .url
            ' | head -n 1)"

            if [ -z "$download_url" ] || [ "$download_url" = "null" ]; then
              download_url="$(printf '%s' "$versions_json" | jq -r '
                [
                  .[]
                  | select(any(.game_versions[]?; startswith("1.21")))
                ][0].files[0].url // empty
              ')"
            fi

            if [ -z "$download_url" ] || [ "$download_url" = "null" ]; then
              echo "::warning::Não foi encontrada uma versão 1.21.x de ${name} no Modrinth."
              return 0
            fi

            if curl -fLsS --retry 2 --retry-delay 2 "$download_url" -o "$temp"; then
              if file "$temp" | grep -qi 'Java archive'; then
                mv "$temp" "$output"
                echo "Plugin instalado: ${name}"
                return 0
              fi
            fi

            rm -f "$temp"
            echo "::warning::O download de ${name} falhou; será mantida a versão existente, se houver."
            return 0
          }

          # Downloads oficiais do GeyserMC.
          download_direct \
            "Geyser-Spigot" \
            "https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot" \
            "Geyser-Spigot.jar"

          download_direct \
            "floodgate-spigot" \
            "https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot" \
            "floodgate-spigot.jar"

          # Projetos públicos consultados pela API oficial do Modrinth.
          # Se um projeto não estiver disponível por essa API, o workflow
          # preserva o JAR que já existir na pasta plugins restaurada.
          download_modrinth "LuckPerms" "luckperms" "LuckPerms.jar"
          download_modrinth "WorldEdit" "worldedit" "WorldEdit.jar"
          download_modrinth "ViaVersion" "viaversion" "ViaVersion.jar"
          download_modrinth "Simple Voice Chat" "voicechat" "voicechat.jar"
          download_modrinth "DropHeads" "dropheads" "DropHeads.jar"
          download_modrinth "SkinsRestorer" "skinsrestorer" "SkinsRestorer.jar"
          download_modrinth "TAB" "tab" "TAB.jar"
          download_modrinth "Shopkeepers" "shopkeepers" "Shopkeepers.jar"

          echo
          echo "Plugins presentes após as tentativas de download:"
          find . -maxdepth 1 -type f -name '*.jar' -printf '%f\n' | sort

      - name: Configurar servidor
        shell: bash
        run: |
          set -euo pipefail

          cd minecraft

          touch server.properties

          if ! grep -q '^online-mode=' server.properties; then
            echo 'online-mode=false' >> server.properties
          else
            sed -i 's/^online-mode=.*/online-mode=false/' server.properties
          fi

          if ! grep -q '^server-port=' server.properties; then
            echo 'server-port=25565' >> server.properties
          fi

          if ! grep -q '^enable-command-block=' server.properties; then
            echo 'enable-command-block=true' >> server.properties
          fi

          mkdir -p logs

      - name: Iniciar Playit
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${PLAYIT_SECRET:-}" ]; then
            echo "::warning::O segredo PLAYIT_SECRET não está configurado. O túnel não será iniciado."
            exit 0
          fi

          docker pull ghcr.io/playit-cloud/playit-agent:latest

          docker run -d \
            --name playit \
            --network host \
            -e SECRET="$PLAYIT_SECRET" \
            ghcr.io/playit-cloud/playit-agent:latest

          sleep 5
          docker logs playit || true

      - name: Iniciar Minecraft e manter o servidor ativo
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        shell: bash
        run: |
          set -euo pipefail

          export RCLONE_CONFIG_GDRIVE2_ROOT_FOLDER_ID="$GDRIVE_FOLDER_ID"

          cd minecraft

          nohup java -Xms2G -Xmx8G -jar paper.jar --nogui \
            > server.log 2>&1 &

          SERVER_PID=$!
          echo "$SERVER_PID" > server.pid

          backup_server() {
            echo "Criando backup do servidor..."

            local archive="server-backup-current.tar.gz"

            tar -czf "$archive" \
              --exclude='./server.log' \
              --exclude='./logs/*' \
              --exclude='./server-backup-*.tar.gz' \
              --exclude='./server.pid' \
              --exclude='./paper.jar' \
              .

            if [ -f "$archive" ]; then
              if timeout 120s rclone copyto \
                gdrive2:server-backup-latest.tar.gz \
                gdrive2:server-backup-previous.tar.gz; then
                echo "Backup anterior preservado."
              else
                echo "Ainda não existe backup anterior, ou não foi possível copiá-lo."
              fi

              timeout 180s rclone copyto \
                "$archive" \
                gdrive2:server-backup-latest.tar.gz

              rm -f "$archive"
              echo "Backup mais recente enviado."
            fi
          }

          echo "Aguardando inicialização do servidor..."
          sleep 120

          if ! kill -0 "$SERVER_PID" 2>/dev/null; then
            echo "::error::O servidor Minecraft encerrou durante a inicialização."
            tail -n 120 server.log || true
            exit 1
          fi

          backup_server

          # Mantém o servidor ativo por aproximadamente 5h25.
          # Faz backup a cada 10 minutos e encerra com backup final.
          for MINUTE in $(seq 1 32); do
            sleep 600

            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "::error::O processo do Minecraft encerrou inesperadamente."
              tail -n 120 server.log || true
              break
            fi

            backup_server
          done

          echo "Preparando backup final..."

          if kill -0 "$SERVER_PID" 2>/dev/null; then
            backup_server
            kill "$SERVER_PID" || true
            sleep 10
          fi

          docker logs playit || true
          tail -n 80 server.log || true

