
name: Minecraft Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minecraft:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Preparar ambiente e instalar rclone
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl jq unzip tar gzip file coreutils python3-pip rclone
          rclone version

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar ferramentas auxiliares
        run: |
          python3 -m pip install --break-system-packages gdown

      - name: Configurar e verificar Google Drive
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${RCLONE_CONFIG_B64:-}" ]; then
            echo "::error::RCLONE_CONFIG_B64 não configurado."
            exit 1
          fi

          if [ -z "${GDRIVE_FOLDER_ID:-}" ]; then
            echo "::error::GDRIVE_FOLDER_ID não configurado."
            exit 1
          fi

          mkdir -p "$HOME/.config/rclone"

          printf '%s' "$RCLONE_CONFIG_B64" \
            | base64 --decode > "$HOME/.config/rclone/rclone.conf"

          chmod 600 "$HOME/.config/rclone/rclone.conf"

          if ! rclone listremotes | grep -qx 'gdrive2:'; then
            echo "::error::O remote gdrive2 não foi encontrado no rclone.conf."
            rclone listremotes || true
            exit 1
          fi

          export RCLONE_CONFIG_GDRIVE2_ROOT_FOLDER_ID="$GDRIVE_FOLDER_ID"

          if ! timeout 30s rclone lsf gdrive2: --max-depth 1 >/dev/null; then
            echo "::error::Falha ao acessar o Google Drive. Verifique a autenticação do rclone."
            exit 1
          fi

          echo "Google Drive conectado."

      - name: Baixar Paper 1.21.11 pela API atual
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p minecraft
          cd minecraft

          MC_VERSION="1.21.11"
          USER_AGENT="Minecraft-Test-GitHub-Actions/1.0 (https://github.com)"
          API_URL="https://fill.papermc.io/v3/projects/paper/versions/${MC_VERSION}/builds"

          BUILDS_JSON="$(curl -fLsS --retry 3 --retry-delay 2 \
            -H "User-Agent: ${USER_AGENT}" \
            -H "Accept: application/json" \
            "$API_URL")"

          PAPER_URL="$(printf '%s' "$BUILDS_JSON" | jq -r '
            first(.[] | select(.channel == "STABLE") |
            .downloads["server:default"].url) // empty
          ')"

          PAPER_SHA256="$(printf '%s' "$BUILDS_JSON" | jq -r '
            first(.[] | select(.channel == "STABLE") |
            .downloads["server:default"].checksums.sha256) // empty
          ')"

          PAPER_BUILD="$(printf '%s' "$BUILDS_JSON" | jq -r '
            first(.[] | select(.channel == "STABLE") | .id) // empty
          ')"

          if [ -z "$PAPER_URL" ] || [ "$PAPER_URL" = "null" ]; then
            echo "::error::Não foi encontrada uma build estável do Paper ${MC_VERSION}."
            exit 1
          fi

          echo "Baixando Paper ${MC_VERSION}, build ${PAPER_BUILD}..."

          curl -fLsS --retry 3 --retry-delay 2 \
            -H "User-Agent: ${USER_AGENT}" \
            "$PAPER_URL" -o paper.jar

          if ! file paper.jar | grep -qi 'Java archive'; then
            echo "::error::O arquivo do Paper não é um JAR válido."
            exit 1
          fi

          if [ -n "$PAPER_SHA256" ] && [ "$PAPER_SHA256" != "null" ]; then
            echo "${PAPER_SHA256}  paper.jar" | sha256sum --check
          fi

      - name: Restaurar backup do servidor
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        shell: bash
        run: |
          set -euo pipefail

          export RCLONE_CONFIG_GDRIVE2_ROOT_FOLDER_ID="$GDRIVE_FOLDER_ID"

          mkdir -p minecraft
          cd minecraft

          RESTORED=false

          if timeout 120s rclone copyto \
            gdrive2:server-backup-latest.tar.gz \
            server-backup-latest.tar.gz; then

            if tar -tzf server-backup-latest.tar.gz >/dev/null 2>&1; then
              tar -xzf server-backup-latest.tar.gz
              RESTORED=true
              echo "Backup mais recente restaurado."
            else
              echo "::warning::O backup mais recente não é válido."
              rm -f server-backup-latest.tar.gz
            fi
          else
            echo "::warning::Não foi possível baixar o backup mais recente."
          fi

          if [ "$RESTORED" != "true" ]; then
            if timeout 120s rclone copyto \
              gdrive2:server-backup-previous.tar.gz \
              server-backup-previous.tar.gz; then

              if tar -tzf server-backup-previous.tar.gz >/dev/null 2>&1; then
                tar -xzf server-backup-previous.tar.gz
                RESTORED=true
                echo "Backup anterior restaurado."
              else
                echo "::warning::O backup anterior não é válido."
              fi
            fi
          fi

          if [ "$RESTORED" != "true" ]; then
            echo "::warning::Tentando recuperar os mundos individualmente."

            for WORLD in world world_nether world_the_end; do
              case "$WORLD" in
                world)
                  ID="1Mf7FoRa_P9Q9idPExaTa6S1hQz5sPbT-"
                  ;;
                world_nether)
                  ID="1TDVch0u3PyuYrYtTTIYsroJm5dcQNrQM"
                  ;;
                world_the_end)
                  ID="1SMTsfqiLlW3R3FpcgfQYZSNwhBw0JJgt"
                  ;;
              esac

              if python3 -m gdown \
                "https://drive.google.com/uc?id=${ID}" \
                -O "${WORLD}.zip"; then

                if [ -s "${WORLD}.zip" ] && unzip -tq "${WORLD}.zip" >/dev/null 2>&1; then
                  mkdir -p "$WORLD"
                  unzip -oq "${WORLD}.zip" -d "$WORLD"
                else
                  echo "::warning::${WORLD}.zip não é um ZIP válido."
                fi
              else
                echo "::warning::Falha ao baixar ${WORLD}."
              fi
            done
          fi

      - name: Aceitar EULA
        run: |
          mkdir -p minecraft
          echo "eula=true" > minecraft/eula.txt

      - name: Baixar plugins públicos individualmente
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p minecraft/plugins
          cd minecraft/plugins

          download_direct() {
            local name="$1"
            local url="$2"
            local output="$3"
            local temp="${output}.download"

            echo "Baixando ${name}..."

            if curl -fLsS --retry 2 --retry-delay 2 "$url" -o "$temp"; then
              if file "$temp" | grep -qi 'Java archive'; then
                mv "$temp" "$output"
                echo "Instalado: ${name}"
                return 0
              fi
            fi

            rm -f "$temp"
            echo "::warning::Falha no download de ${name}; JAR existente preservado, se houver."
          }

          download_modrinth() {
            local name="$1"
            local slug="$2"
            local output="$3"
            local versions_json
            local download_url
            local temp="${output}.download"

            echo "Consultando ${name}..."

            if ! versions_json="$(curl -fLsS --retry 2 \
              "https://api.modrinth.com/v2/project/${slug}/version")"; then
              echo "::warning::Não foi possível consultar ${name} no Modrinth."
              return 0
            fi

            download_url="$(printf '%s' "$versions_json" | jq -r '
              [
                .[]
                | select(any(.game_versions[]?; startswith("1.21")))
              ][0].files[]?
              | select(.primary == true)
              | .url
            ' | head -n 1)"

            if [ -z "$download_url" ] || [ "$download_url" = "null" ]; then
              download_url="$(printf '%s' "$versions_json" | jq -r '
                [
                  .[]
                  | select(any(.game_versions[]?; startswith("1.21")))
                ][0].files[0].url // empty
              ')"
            fi

            if [ -z "$download_url" ] || [ "$download_url" = "null" ]; then
              echo "::warning::Nenhum arquivo compatível encontrado para ${name}."
              return 0
            fi

            if curl -fLsS --retry 2 --retry-delay 2 "$download_url" -o "$temp"; then
              if file "$temp" | grep -qi 'Java archive'; then
                mv "$temp" "$output"
                echo "Instalado: ${name}"
                return 0
              fi
            fi

            rm -f "$temp"
            echo "::warning::Download inválido de ${name}; JAR existente preservado, se houver."
            return 0
          }

          download_direct \
            "Geyser-Spigot" \
            "https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot" \
            "Geyser-Spigot.jar"

          download_direct \
            "Floodgate" \
            "https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot" \
            "floodgate-spigot.jar"

          download_modrinth "LuckPerms" "luckperms" "LuckPerms.jar"
          download_modrinth "WorldEdit" "worldedit" "WorldEdit.jar"
          download_modrinth "ViaVersion" "viaversion" "ViaVersion.jar"
          download_modrinth "Simple Voice Chat" "simple-voice-chat" "voicechat.jar"
          download_modrinth "DropHeads" "dropheads" "DropHeads.jar"
          download_modrinth "SkinsRestorer" "skinsrestorer" "SkinsRestorer.jar"
          download_modrinth "TAB" "tab" "TAB.jar"
          download_modrinth "Shopkeepers" "shopkeepers" "Shopkeepers.jar"

          echo "Plugins presentes:"
          find . -maxdepth 1 -type f -name '*.jar' -printf '%f\n' | sort

      - name: Configurar servidor
        shell: bash
        run: |
          set -euo pipefail

          cd minecraft
          touch server.properties

          if grep -q '^online-mode=' server.properties; then
            sed -i 's/^online-mode=.*/online-mode=false/' server.properties
          else
            echo 'online-mode=false' >> server.properties
          fi

          if ! grep -q '^server-port=' server.properties; then
            echo 'server-port=25565' >> server.properties
          fi

          if ! grep -q '^enable-command-block=' server.properties; then
            echo 'enable-command-block=true' >> server.properties
          fi

          mkdir -p logs

      - name: Iniciar Playit
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${PLAYIT_SECRET:-}" ]; then
            echo "::warning::PLAYIT_SECRET não configurado; túnel não iniciado."
            exit 0
          fi

          docker pull ghcr.io/playit-cloud/playit-agent:latest

          docker run -d \
            --name playit \
            --network host \
            -e SECRET="$PLAYIT_SECRET" \
            ghcr.io/playit-cloud/playit-agent:latest

          sleep 5
          docker logs playit || true

      - name: Executar Minecraft e fazer backups
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        shell: bash
        run: |
          set -euo pipefail

          export RCLONE_CONFIG_GDRIVE2_ROOT_FOLDER_ID="$GDRIVE_FOLDER_ID"
          cd minecraft

          nohup java -Xms2G -Xmx8G -jar paper.jar --nogui \
            > server.log 2>&1 &

          SERVER_PID=$!
          echo "$SERVER_PID" > server.pid

          backup_server() {
            echo "Criando backup..."

            local archive="server-backup-current.tar.gz"
            local tar_status=0

            rm -f "$archive"

            # O servidor continua ativo. O tar pode retornar código 1
            # se algum arquivo mudar durante a leitura; verificamos
            # separadamente se o arquivo compactado continua legível.
            set +e
            tar --warning=no-file-changed \
              --ignore-failed-read \
              -czf "$archive" \
              --exclude='./server.log' \
              --exclude='./logs/*' \
              --exclude='./server-backup-*.tar.gz' \
              --exclude='./server.pid' \
              --exclude='./paper.jar' \
              .
            tar_status=$?
            set -e

            if [ ! -s "$archive" ] || ! tar -tzf "$archive" >/dev/null 2>&1; then
              echo "::error::O arquivo de backup não foi gerado corretamente."
              rm -f "$archive"
              return 1
            fi

            if [ "$tar_status" -ne 0 ]; then
              echo "::warning::Alguns arquivos mudaram durante a compactação. O arquivo passou na validação, mas pode não representar um estado perfeitamente consistente do mundo."
            fi

            # Atualiza o backup anterior somente depois de criar e validar
            # o novo arquivo local.
            if timeout 120s rclone copyto \
              gdrive2:server-backup-latest.tar.gz \
              gdrive2:server-backup-previous.tar.gz; then
              echo "Backup anterior preservado."
            else
              echo "Não foi possível copiar o backup anterior; continuando."
            fi

            timeout 180s rclone copyto \
              "$archive" \
              gdrive2:server-backup-latest.tar.gz

            rm -f "$archive"
            echo "Backup mais recente enviado ao Google Drive."
          }

          echo "Aguardando o Minecraft iniciar..."
          sleep 120

          if ! kill -0 "$SERVER_PID" 2>/dev/null; then
            echo "::error::O servidor encerrou durante a inicialização."
            tail -n 120 server.log || true
            exit 1
          fi

          backup_server

          for CYCLE in $(seq 1 32); do
            sleep 600

            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "::warning::O Minecraft encerrou inesperadamente."
              tail -n 120 server.log || true
              break
            fi

            backup_server
          done

          echo "Criando backup final..."

          if kill -0 "$SERVER_PID" 2>/dev/null; then
            backup_server || echo "::error::Falha ao criar o backup final."
            kill "$SERVER_PID" || true
            sleep 10
          fi

          docker logs playit || true
          tail -n 80 server.log || true
