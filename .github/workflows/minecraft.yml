
name: Minecraft Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minecraft:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    env:
      MC_VERSION: "1.21.11"
      SERVER_DIR: minecraft
      PLUGIN_ZIP_ID: "14OF6wa80pT4VOJch7-8kdvs42jRnCj78"
      WORLD_ID: "1Mf7FoRa_P9Q9idPExaTa6S1hQz5sPbT-"
      NETHER_ID: "1TDVch0u3PyuYrYtTTIYsroJm5dcQNrQM"
      END_ID: "1SMTsfqiLlW3R3FpcgfQYZSNwhBw0JJgt"

    steps:
      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar ferramentas necessárias
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y rclone jq unzip tar gzip curl

      - name: Verificar Docker existente
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! command -v docker >/dev/null 2>&1; then
            echo "::error::Docker não está disponível no runner."
            exit 1
          fi
          docker info

      - name: Configurar Google Drive
        shell: bash
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          set -Eeuo pipefail

          [[ -n "${RCLONE_CONFIG_B64:-}" ]] || {
            echo "::error::RCLONE_CONFIG_B64 está vazio."
            exit 1
          }

          [[ -n "${GDRIVE_FOLDER_ID:-}" ]] || {
            echo "::error::GDRIVE_FOLDER_ID está vazio."
            exit 1
          }

          mkdir -p "$HOME/.config/rclone"
          printf '%s' "$RCLONE_CONFIG_B64" |
            base64 --decode > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"

          echo "RCLONE_CONFIG_GDRIVE2_ROOT_FOLDER_ID=$GDRIVE_FOLDER_ID" >> "$GITHUB_ENV"

          if ! rclone lsf gdrive2: >/dev/null; then
            echo "::error::Falha ao acessar o Google Drive. Verifique a autenticação."
            exit 1
          fi

          echo "Google Drive acessível."

      - name: Preparar diretórios
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$SERVER_DIR" /tmp/minecraft-restore

      - name: Restaurar backup completo mais recente
        shell: bash
        run: |
          set -Eeuo pipefail

          if rclone copyto \
            "gdrive2:server-backup-latest.tar.gz" \
            "/tmp/server-backup-latest.tar.gz" \
            --retries 3 --low-level-retries 5; then

            if ! gzip -t /tmp/server-backup-latest.tar.gz; then
              echo "::error::O backup mais recente está corrompido."
              exit 1
            fi

            tar -xzf /tmp/server-backup-latest.tar.gz \
              -C "$GITHUB_WORKSPACE"

            touch /tmp/minecraft-backup-restored
            echo "Backup completo restaurado."
          else
            echo "Backup completo não encontrado. Será tentada a restauração dos mundos individuais."
          fi

      - name: Restaurar mundos individuais se necessário
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -f /tmp/minecraft-backup-restored ]]; then
            echo "Mundos já restaurados pelo backup completo."
            exit 0
          fi

          find_drive_path_by_id() {
            local file_id="$1"
            rclone lsjson gdrive2: --recursive --files-only --metadata |
              jq -er --arg id "$file_id" \
                'first(.[] | select((.ID // .ID) == $id) | .Path) // empty'
          }

          restore_world() {
            local name="$1"
            local id="$2"
            local path

            if ! path="$(find_drive_path_by_id "$id")"; then
              echo "::warning::ZIP do mundo $name não encontrado."
              return 0
            fi

            rclone copyto "gdrive2:$path" "/tmp/minecraft-restore/$name.zip" \
              --retries 3 --low-level-retries 5

            unzip -tq "/tmp/minecraft-restore/$name.zip"
            unzip -oq "/tmp/minecraft-restore/$name.zip" -d "$SERVER_DIR"
            echo "Mundo $name restaurado."
          }

          restore_world "world" "$WORLD_ID"
          restore_world "world_nether" "$NETHER_ID"
          restore_world "world_the_end" "$END_ID"

      - name: Localizar e restaurar ZIP de plugins
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Listando arquivos do Google Drive para localizar o ZIP..."

          rclone lsjson gdrive2: \
            --recursive --files-only --metadata \
            > /tmp/drive-files.json

          echo "Procurando primeiro pelo ID configurado..."

          PLUGIN_PATH="$(
            jq -r --arg id "$PLUGIN_ZIP_ID" '
              [.[] | select((.ID // "") == $id) | .Path]
              | first // empty
            ' /tmp/drive-files.json
          )"

          if [[ -n "$PLUGIN_PATH" ]]; then
            echo "Pacote localizado pelo ID."
          else
            echo "::warning::O ID configurado não foi encontrado. Procurando ZIPs pelo nome."

            mapfile -t CANDIDATES < <(
              jq -r '
                .[]
                | select((.Path // "") | test("plugin"; "i"))
                | select((.Path // "") | test("\\.zip$"; "i"))
                | .Path
              ' /tmp/drive-files.json
            )

            if [[ "${#CANDIDATES[@]}" -eq 1 ]]; then
              PLUGIN_PATH="${CANDIDATES[0]}"
              echo "Encontrado um único ZIP com 'plugin' no nome: $PLUGIN_PATH"

            elif [[ "${#CANDIDATES[@]}" -gt 1 ]]; then
              echo "::error::Foram encontrados vários ZIPs relacionados a plugins. É necessário identificar o correto."
              printf 'Candidato: %s\n' "${CANDIDATES[@]}"
              echo "Lista de outros ZIPs disponíveis:"
              jq -r '.[] | select((.Path // "") | test("\\.zip$"; "i")) | .Path' \
                /tmp/drive-files.json || true
              exit 1

            else
              echo "::error::Nenhum ZIP com 'plugin' no nome foi encontrado."
              echo "Arquivos ZIP visíveis para esta conta:"
              jq -r '
                .[]
                | select((.Path // "") | test("\\.zip$"; "i"))
                | "Nome: \(.Path) | ID: \(.ID // "não informado")"
              ' /tmp/drive-files.json || true
              echo "Confira se o pacote está dentro da pasta configurada em GDRIVE_FOLDER_ID."
              exit 1
            fi
          fi

          rclone copyto "gdrive2:$PLUGIN_PATH" /tmp/plugins.zip \
            --retries 3 --low-level-retries 5

          if ! unzip -tq /tmp/plugins.zip; then
            echo "::error::O arquivo localizado não é um ZIP válido."
            exit 1
          fi

          mkdir -p /tmp/plugins-extraidos "$SERVER_DIR/plugins"
          unzip -oq /tmp/plugins.zip -d /tmp/plugins-extraidos

          mapfile -d '' JARS < <(
            find /tmp/plugins-extraidos -type f -iname '*.jar' -print0
          )

          if [[ "${#JARS[@]}" -eq 0 ]]; then
            echo "::error::O ZIP não contém arquivos .jar."
            exit 1
          fi

          for jar in "${JARS[@]}"; do
            cp -f "$jar" "$SERVER_DIR/plugins/"
          done

          echo "Total de plugins JAR restaurados: ${#JARS[@]}"

      - name: Baixar Paper 1.21.11
        shell: bash
        run: |
          set -Eeuo pipefail

          API="https://api.papermc.io/v3/projects/paper/versions/$MC_VERSION"
          curl -fsSL "$API/builds" -o /tmp/paper-builds.json

          BUILD="$(
            jq -er '[.builds[] | select(.channel == "STABLE")] | max_by(.id) | .id' \
              /tmp/paper-builds.json
          )"

          DOWNLOAD_URL="$(
            curl -fsSL "$API/builds/$BUILD" |
              jq -er '.downloads["server:default"].url'
          )"

          curl -fL --retry 3 "$DOWNLOAD_URL" -o "$SERVER_DIR/paper.jar"
          test -s "$SERVER_DIR/paper.jar"
          echo "Paper baixado. Build: $BUILD"

      - name: Preparar configurações
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$SERVER_DIR"

          if [[ ! -f server.properties ]]; then
            cat > server.properties <<'PROPERTIES'
          online-mode=false
          enable-command-block=true
          server-port=25565
          motd=Servidor Minecraft
          view-distance=8
          simulation-distance=6
          PROPERTIES
          fi

          if [[ ! -f eula.txt ]]; then
            echo "eula=true" > eula.txt
          else
            sed -i 's/^eula=false$/eula=true/' eula.txt
          fi

      - name: Iniciar agente Playit
        shell: bash
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          set -Eeuo pipefail

          [[ -n "${PLAYIT_SECRET:-}" ]] || {
            echo "::error::PLAYIT_SECRET está vazio."
            exit 1
          }

          docker pull ghcr.io/playit-cloud/playit-agent:latest
          docker rm -f playit-agent >/dev/null 2>&1 || true

          docker run -d \
            --name playit-agent \
            --network host \
            --restart unless-stopped \
            -e SECRET="$PLAYIT_SECRET" \
            ghcr.io/playit-cloud/playit-agent:latest

          sleep 5
          docker ps --filter name=playit-agent

      - name: Executar servidor e criar backups
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/$SERVER_DIR"

          java -Xms2G -Xmx8G -jar paper.jar --nogui > server.log 2>&1 &
          SERVER_PID=$!
          START_TIME="$(date +%s)"
          MAX_RUNTIME=$((325 * 60))

          backup_server() {
            local archive="$GITHUB_WORKSPACE/server-backup-latest.tar.gz"

            echo "Criando backup do servidor..."

            local tar_status=0
            set +e
            tar --warning=no-file-changed --ignore-failed-read \
              -czf "$archive" -C "$GITHUB_WORKSPACE" "$SERVER_DIR"
            tar_status=$?
            set -e

            if [[ ! -s "$archive" ]] || ! gzip -t "$archive"; then
              echo "::error::Backup inválido."
              return 1
            fi

            if [[ "$tar_status" -ne 0 ]]; then
              echo "::warning::Alguns arquivos mudaram durante o backup."
            fi

            if rclone copyto \
              "gdrive2:server-backup-latest.tar.gz" \
              "gdrive2:server-backup-previous.tar.gz" \
              --retries 2 --low-level-retries 3; then
              echo "Backup anterior preservado."
            fi

            rclone copyto "$archive" "gdrive2:server-backup-latest.tar.gz" \
              --retries 3 --low-level-retries 5

            echo "Backup enviado ao Google Drive."
          }

          sleep 120

          if ! kill -0 "$SERVER_PID" 2>/dev/null; then
            echo "::error::O Minecraft encerrou durante a inicialização."
            tail -n 150 server.log || true
            exit 1
          fi

          backup_server

          while kill -0 "$SERVER_PID" 2>/dev/null; do
            ELAPSED=$(($(date +%s) - START_TIME))
            if (( ELAPSED >= MAX_RUNTIME )); then
              break
            fi

            sleep 600

            if kill -0 "$SERVER_PID" 2>/dev/null; then
              backup_server
            fi
          done

          backup_server
          kill "$SERVER_PID" 2>/dev/null || true

          for _ in {1..30}; do
            kill -0 "$SERVER_PID" 2>/dev/null || break
            sleep 1
          done

          kill -9 "$SERVER_PID" 2>/dev/null || true
          echo "Servidor encerrado e backup final enviado."

      - name: Diagnóstico em caso de falha
        if: ${{ failure() }}
        shell: bash
        run: |
          echo "===== PROCESSOS ====="
          ps aux | grep -E 'java|playit' | grep -v grep || true

          echo "===== LOG DO MINECRAFT ====="
          tail -n 200 minecraft/server.log 2>/dev/null || true

          echo "===== LOG DO PLAYIT ====="
          docker logs --tail 100 playit-agent 2>&1 || true

          echo "===== ARQUIVOS ZIP ENCONTRADOS ====="
          if [[ -f /tmp/drive-files.json ]]; then
            jq -r '
              .[]
              | select((.Path // "") | test("\\.zip$"; "i"))
              | "Nome: \(.Path) | ID: \(.ID // "não informado")"
            ' /tmp/drive-files.json || true
          fi
