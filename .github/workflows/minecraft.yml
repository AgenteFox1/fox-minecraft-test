name: Minecraft Test

on:
  workflow_dispatch:

jobs:
  minecraft:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # JAVA
      # ==========================================

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'


      # ==========================================
      # PAPER
      # ==========================================

      - name: Baixar Paper 1.21.11
        run: |
          mkdir -p minecraft
          cd minecraft

          echo "========================================"
          echo "BAIXANDO PAPER 1.21.11"
          echo "========================================"

          RESPONSE=$(curl -fsSL \
            -H "User-Agent: fox-minecraft-test/1.0" \
            "https://fill.papermc.io/v3/projects/paper/versions/1.21.11/builds")

          DOWNLOAD_URL=$(echo "$RESPONSE" | \
            jq -r 'map(select(.channel == "STABLE")) | .[0].downloads["server:default"].url')

          echo ""
          echo "Download:"
          echo "$DOWNLOAD_URL"

          curl -fL \
            -H "User-Agent: fox-minecraft-test/1.0" \
            -o paper.jar \
            "$DOWNLOAD_URL"

          echo ""
          echo "Paper baixado:"

          ls -lh paper.jar


      # ==========================================
      # EULA
      # ==========================================

      - name: Aceitar EULA
        run: |
          echo "eula=true" > minecraft/eula.txt


      # ==========================================
      # GDOWN
      # ==========================================

      - name: Instalar gdown
        run: |
          echo "========================================"
          echo "INSTALANDO GDOWN"
          echo "========================================"

          python3 -m pip install --upgrade pip
          python3 -m pip install gdown
          python3 -m pip install nbtlib

          echo ""
          echo "gdown:"
          gdown --version

          echo ""
          echo "nbtlib:"
          python3 -c "import nbtlib; print(nbtlib.__version__)"


      # ==========================================
      # MAPAS
      # ==========================================

      - name: Baixar mapas do Google Drive
        run: |
          echo "========================================"
          echo "BAIXANDO MAPAS"
          echo "========================================"

          mkdir -p minecraft

          echo ""
          echo "Baixando Overworld..."

          gdown \
            "https://drive.google.com/uc?id=1Mf7FoRa_P9Q9idPExaTa6S1hQz5sPbT-" \
            -O minecraft/world.zip

          echo ""
          echo "Baixando Nether..."

          gdown \
            "https://drive.google.com/uc?id=1TDVch0u3PyuYrYtTTIYsroJm5dcQNrQM" \
            -O minecraft/world_nether.zip

          echo ""
          echo "Baixando The End..."

          gdown \
            "https://drive.google.com/uc?id=1SMTsfqiLlW3R3FpcgfQYZSNwhBw0JJgt" \
            -O minecraft/world_the_end.zip

          echo ""
          echo "========================================"
          echo "MAPAS BAIXADOS"
          echo "========================================"

          ls -lh minecraft/*.zip


      # ==========================================
      # INSTALAR MAPAS
      # ==========================================

      - name: Instalar mapas
        run: |
          echo "========================================"
          echo "INSTALANDO MAPAS"
          echo "========================================"

          cd minecraft

          rm -rf world world_nether world_the_end

          echo ""
          echo "Extraindo Overworld..."

          unzip -q world.zip

          echo ""
          echo "Extraindo Nether..."

          unzip -q world_nether.zip

          echo ""
          echo "Extraindo The End..."

          unzip -q world_the_end.zip

          echo ""
          echo "Removendo ZIPs..."

          rm world.zip
          rm world_nether.zip
          rm world_the_end.zip

          echo ""
          echo "========================================"
          echo "MUNDOS INSTALADOS"
          echo "========================================"

          echo ""
          echo "Overworld:"
          du -sh world

          echo ""
          echo "Nether:"
          du -sh world_nether

          echo ""
          echo "The End:"
          du -sh world_the_end


      # ==========================================
      # BAIXAR PLAYERDATA
      # ==========================================

      - name: Baixar PlayerData do Google Drive
        run: |
          echo "========================================"
          echo "BAIXANDO PLAYERDATA"
          echo "========================================"

          mkdir -p minecraft

          PLAYERDATA_ID="1LXkLNo6voDQb_T7rafrKv6R6MBomPfRv"

          echo ""
          echo "ID:"
          echo "$PLAYERDATA_ID"

          echo ""
          echo "Baixando..."

          gdown \
            "$PLAYERDATA_ID" \
            -O minecraft/playerdata.gz

          echo ""
          echo "========================================"
          echo "ARQUIVO RECEBIDO"
          echo "========================================"

          ls -lh minecraft/playerdata.gz

          echo ""
          echo "Tipo:"

          file minecraft/playerdata.gz


      # ==========================================
      # LER E INSTALAR PLAYERDATA
      # ==========================================

      - name: Instalar PlayerData
        run: |
          echo "========================================"
          echo "INSTALANDO PLAYERDATA"
          echo "========================================"

          cd minecraft

          echo ""
          echo "Validando GZIP..."

          if ! gzip -t playerdata.gz; then
            echo ""
            echo "ERRO: GZIP INVALIDO."
            exit 1
          fi

          echo ""
          echo "GZIP VALIDO!"

          echo ""
          echo "========================================"
          echo "DESCOMPACTANDO"
          echo "========================================"

          gzip -dc playerdata.gz > playerdata.dat

          echo ""
          echo "Arquivo descompactado:"

          ls -lh playerdata.dat

          echo ""
          echo "========================================"
          echo "LENDO NBT DO PLAYER"
          echo "========================================"

          python3 << 'PY'
          import nbtlib
          import uuid
          import os
          import shutil

          source = "playerdata.dat"
          output_dir = "world/playerdata"

          print("")
          print("Carregando NBT...")
          print("Arquivo:", source)

          try:
              nbt = nbtlib.load(source, gzipped=False)
          except Exception as e:
              print("")
              print("ERRO AO LER NBT:")
              print(e)
              raise SystemExit(1)

          print("")
          print("NBT carregado com sucesso!")

          print("")
          print("Tags principais:")

          for key in nbt.keys():
              print(" -", key)

          print("")
          print("Procurando UUID...")

          root = nbt.root

          found_uuid = None

          # ------------------------------------------
          # Tentativa 1: UUID diretamente
          # ------------------------------------------

          if "UUID" in root:
              value = root["UUID"]

              print("")
              print("Tag UUID encontrada:")
              print(value)

              try:
                  values = [int(x) for x in value]

                  if len(values) == 4:
                      b = b"".join(
                          int(x & 0xffffffff).to_bytes(
                              4,
                              byteorder="big",
                              signed=False
                          )
                          for x in values
                      )

                      found_uuid = str(uuid.UUID(bytes=b))

              except Exception as e:
                  print("Nao foi possivel converter UUID:", e)

          # ------------------------------------------
          # Tentativa 2: UUIDMost / UUIDLeast
          # ------------------------------------------

          if found_uuid is None:
              if "UUIDMost" in root and "UUIDLeast" in root:

                  print("")
                  print("Encontrados UUIDMost e UUIDLeast.")

                  most = int(root["UUIDMost"])
                  least = int(root["UUIDLeast"])

                  most &= (1 << 64) - 1
                  least &= (1 << 64) - 1

                  raw = (
                      most.to_bytes(8, byteorder="big") +
                      least.to_bytes(8, byteorder="big")
                  )

                  found_uuid = str(uuid.UUID(bytes=raw))

          # ------------------------------------------
          # Resultado
          # ------------------------------------------

          if found_uuid is None:

              print("")
              print("========================================")
              print("UUID NAO ENCONTRADO")
              print("========================================")

              print("")
              print("Tags disponiveis:")

              for key in root.keys():
                  print(key)

              raise SystemExit(1)

          print("")
          print("========================================")
          print("UUID ENCONTRADO")
          print("========================================")

          print("")
          print("UUID:")
          print(found_uuid)

          # ------------------------------------------
          # Criar pasta playerdata
          # ------------------------------------------

          os.makedirs(output_dir, exist_ok=True)

          destination = os.path.join(
              output_dir,
              found_uuid + ".dat"
          )

          print("")
          print("Destino:")
          print(destination)

          shutil.copyfile(source, destination)

          print("")
          print("========================================")
          print("PLAYERDATA INSTALADO")
          print("========================================")

          print("")
          print("Arquivo:")
          print(destination)

          print("")
          print("Tamanho:")
          print(os.path.getsize(destination), "bytes")

          PY

          echo ""
          echo "========================================"
          echo "PLAYERDATA FINAL"
          echo "========================================"

          ls -lah world/playerdata

          echo ""
          echo "Arquivos .dat:"

          find world/playerdata -type f -name "*.dat" -print

          echo ""
          echo "Quantidade:"

          find world/playerdata -type f -name "*.dat" | wc -l

          echo ""
          echo "Removendo temporarios..."

          rm -f playerdata.dat
          rm -f playerdata.gz

          echo ""
          echo "========================================"
          echo "PLAYERDATA FINALIZADO"
          echo "========================================"


      # ==========================================
      # PLAYIT
      # ==========================================

      - name: Iniciar Playit
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          echo "========================================"
          echo "INICIANDO PLAYIT"
          echo "========================================"

          docker rm -f playit 2>/dev/null || true

          docker run \
            -d \
            --name playit \
            --network host \
            --restart unless-stopped \
            -e SECRET_KEY="$PLAYIT_SECRET" \
            ghcr.io/playit-cloud/playit-agent:latest

          echo ""
          echo "Aguardando Playit..."

          sleep 10

          echo ""
          echo "========================================"
          echo "LOG DO PLAYIT"
          echo "========================================"

          docker logs playit


      # ==========================================
      # VERIFICAR PLAYIT
      # ==========================================

      - name: Verificar Playit
        run: |
          echo "========================================"
          echo "STATUS DO PLAYIT"
          echo "========================================"

          docker ps --filter "name=playit"

          echo ""
          echo "Logs recentes:"

          docker logs --tail 50 playit

          echo ""
          echo "========================================"


      # ==========================================
      # INICIAR MINECRAFT
      # ==========================================

      - name: Iniciar Minecraft
        run: |
          cd minecraft

          echo "========================================"
          echo "INICIANDO MINECRAFT"
          echo "========================================"

          echo ""
          echo "Java:"

          java -version

          echo ""
          echo "Mundos:"

          du -sh world world_nether world_the_end

          echo ""
          echo "PlayerData:"

          if [ -d "world/playerdata" ]; then
            ls -lah world/playerdata

            echo ""
            echo "Arquivos .dat:"

            find world/playerdata -type f -name "*.dat" | wc -l
          else
            echo "Nenhuma pasta playerdata encontrada."
          fi

          echo ""
          echo "========================================"
          echo "SERVIDOR INICIANDO"
          echo "========================================"

          java \
            -Xms2G \
            -Xmx8G \
            -jar paper.jar \
            nogui


      # ==========================================
      # LOG FINAL DO PLAYIT
      # ==========================================

      - name: Mostrar logs do Playit
        if: always()
        run: |
          echo "========================================"
          echo "LOG FINAL DO PLAYIT"
          echo "========================================"

          docker logs playit || true

          echo ""
          echo "========================================"
          echo "FIM DO WORKFLOW"
          echo "========================================"
