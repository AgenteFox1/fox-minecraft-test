
name: Minecraft Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minecraft-test-server
  cancel-in-progress: false

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
      PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}

      PLUGIN_ZIP_ID: "14OF6wa80pT4VOJch7-8kdvs42jRnCj78"
      WORLD_ZIP_ID: "1Mf7FoRa_P9Q9idPExaTa6S1hQz5sPbT-"
      NETHER_ZIP_ID: "1TDVch0u3PyuYrYtTTIYsroJm5dcQNrQM"
      END_ZIP_ID: "1SMTsfqiLlW3R3FpcgfQYZSNwhBw0JJgt"

    steps:
      - name: Preparar Java e ferramentas
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            openjdk-21-jre-headless curl jq unzip tar gzip \
            coreutils rclone docker.io

          mkdir -p minecraft/plugins downloads logs

          java -version
          rclone version

      - name: Configurar Google Drive
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -z "${RCLONE_CONFIG_B64:-}" ]]; then
            echo "::error::Secret RCLONE_CONFIG_B64 não configurado."
            exit 1
          fi

          mkdir -p "$HOME/.config/rclone"

          printf '%s' "$RCLONE_CONFIG_B64" \
            | base64 --decode \
            > "$HOME/.config/rclone/rclone.conf"

          chmod 600 "$HOME/.config/rclone/rclone.conf"

          if [[ -n "${GDRIVE_FOLDER_ID:-}" ]]; then
            echo "RCLONE_CONFIG_GDRIVE2_ROOT_FOLDER_ID=$GDRIVE_FOLDER_ID" \
              >> "$GITHUB_ENV"
          fi

          if ! timeout 45s rclone lsf gdrive2: --max-depth 1; then
            echo "::error::Não foi possível acessar o Google Drive. Verifique RCLONE_CONFIG_B64 e GDRIVE_FOLDER_ID."
            exit 1
          fi

      - name: Baixar backup mais recente
        id: backup
        shell: bash
        run: |
          set -Eeuo pipefail

          if rclone copyto \
              "gdrive2:server-backup-latest.tar.gz" \
              "$PWD/downloads/server-backup-latest.tar.gz" \
              --retries 3; then

            if tar -tzf downloads/server-backup-latest.tar.gz >/dev/null; then
              echo "available=true" >> "$GITHUB_OUTPUT"
              echo "Backup completo validado."
            else
              echo "::error::O backup baixado não é um TAR.GZ válido."
              exit 1
            fi
          else
            echo "Backup completo não encontrado. Tentarei restaurar os mundos individualmente."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restaurar backup completo
        if: steps.backup.outputs.available == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p minecraft

          tar --no-same-owner \
            -xzf downloads/server-backup-latest.tar.gz \
            -C minecraft

          echo "Backup extraído."

          for world in world world_nether world_the_end; do
            if [[ -d "minecraft/$world" ]]; then
              echo "Mundo encontrado: $world"
            else
              echo "Aviso: $world não está no backup."
            fi
          done

      - name: Restaurar mundos por arquivo individual
        if: steps.backup.outputs.available != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          # Procura o arquivo pelo ID na listagem do remote e
          # baixa pelo caminho encontrado. Não usa rclone copyid.
          download_drive_id() {
            local file_id="$1"
            local output="$2"
            local remote_path

            remote_path="$(
              rclone lsjson gdrive2: --recursive --files-only \
                | jq -r --arg id "$file_id" \
                    '.[] | select(.ID == $id) | .Path' \
                | head -n 1
            )"

            if [[ -z "$remote_path" ]]; then
              echo "::error::Arquivo com ID $file_id não encontrado no remote gdrive2:."
              return 1
            fi

            echo "Arquivo localizado: $remote_path"

            rclone copyto "gdrive2:$remote_path" "$output" \
              --retries 3 \
              --low-level-retries 5

            test -s "$output"
            unzip -t "$output" >/dev/null
          }

          restore_world() {
            local file_id="$1"
            local world_name="$2"
            local zip_name="$3"

            download_drive_id "$file_id" "$PWD/downloads/$zip_name"

            mkdir -p "minecraft/$world_name"

            unzip -oq "downloads/$zip_name" \
              -d "minecraft/$world_name"

            echo "Mundo restaurado: $world_name"
          }

          restore_world "$WORLD_ZIP_ID" world world.zip
          restore_world "$NETHER_ZIP_ID" world_nether world_nether.zip
          restore_world "$END_ZIP_ID" world_the_end world_the_end.zip

      - name: Baixar e restaurar ZIP de plugins
        shell: bash
        run: |
          set -Eeuo pipefail

          # Encontra o ZIP pelo ID usando a listagem do Google Drive.
          remote_path="$(
            rclone lsjson gdrive2: --recursive --files-only \
              | jq -r --arg id "$PLUGIN_ZIP_ID" \
                  '.[] | select(.ID == $id) | .Path' \
              | head -n 1
          )"

          if [[ -z "$remote_path" ]]; then
            echo "::error::ZIP de plugins não encontrado. Confira o PLUGIN_ZIP_ID e a pasta do Drive."
            exit 1
          fi

          echo "ZIP de plugins localizado: $remote_path"

          rclone copyto "gdrive2:$remote_path" \
            "$PWD/downloads/plugins-drive.zip" \
            --retries 3 \
            --low-level-retries 5

          test -s downloads/plugins-drive.zip

          if ! unzip -t downloads/plugins-drive.zip >/dev/null; then
            echo "::error::O ZIP de plugins está inválido."
            exit 1
          fi

          mkdir -p downloads/plugins-extraidos minecraft/plugins

          unzip -oq downloads/plugins-drive.zip \
            -d downloads/plugins-extraidos

          mapfile -d '' plugin_jars < <(
            find downloads/plugins-extraidos \
              -type f -iname '*.jar' -print0
          )

          if (( ${#plugin_jars[@]} == 0 )); then
            echo "::error::Nenhum .jar foi encontrado no ZIP."
            find downloads/plugins-extraidos -maxdepth 4 -type f | head -200
            exit 1
          fi

          for jar in "${plugin_jars[@]}"; do
            filename="$(basename "$jar")"
            cp -f "$jar" "minecraft/plugins/$filename"
            echo "Plugin instalado: $filename"
          done

          echo "Total de JARs instalados: ${#plugin_jars[@]}"

      - name: Baixar Paper 1.21.11
        shell: bash
        run: |
          set -Eeuo pipefail

          cd minecraft

          API="https://fill.papermc.io/v3/projects/paper/versions/1.21.11/builds"

          response="$(
            curl -fsSL \
              -H "User-Agent: OdisseiaMinecraftServer/1.0" \
              "$API"
          )"

          BUILD="$(
            printf '%s' "$response" \
              | jq -r '
                  if type == "array" then
                    [.[] | select((.channel // "") == "STABLE")][0].id // empty
                  else
                    empty
                  end
                '
          )"

          if [[ -z "$BUILD" ]]; then
            echo "::error::Não foi encontrada uma build estável do Paper 1.21.11."
            exit 1
          fi

          BUILD_INFO="$(
            curl -fsSL \
              -H "User-Agent: OdisseiaMinecraftServer/1.0" \
              "$API/$BUILD"
          )"

          DOWNLOAD_URL="$(
            printf '%s' "$BUILD_INFO" \
              | jq -r '
                  .. | objects
                  | select(.downloads? != null)
                  | .downloads["server:default"].url // empty
                ' | head -n 1
          )"

          if [[ -z "$DOWNLOAD_URL" ]]; then
            echo "::error::Não foi possível localizar o JAR do Paper."
            printf '%s' "$BUILD_INFO" | jq .
            exit 1
          fi

          curl -fL --retry 3 "$DOWNLOAD_URL" -o paper.jar
          test -s paper.jar

      - name: Preparar servidor
        shell: bash
        run: |
          set -Eeuo pipefail

          cd minecraft

          if [[ ! -f eula.txt ]]; then
            echo "eula=true" > eula.txt
          fi

          if [[ ! -f server.properties ]]; then
            cat > server.properties <<'PROPERTIES'
          server-port=25565
          online-mode=false
          enable-command-block=true
          motd=Servidor Minecraft
          view-distance=8
          simulation-distance=6
          max-players=20
          PROPERTIES
          fi

          cat > start.sh <<'START'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          exec java -Xms2G -Xmx8G -jar paper.jar --nogui
          START

          chmod +x start.sh

          echo "Plugins: $(find plugins -maxdepth 1 -type f -iname '*.jar' | wc -l)"

          for world in world world_nether world_the_end; do
            [[ -d "$world" ]] && echo "OK: $world" \
              || echo "Aviso: $world não existe."
          done

      - name: Iniciar Playit
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -z "${PLAYIT_SECRET:-}" ]]; then
            echo "::error::Secret PLAYIT_SECRET não configurado."
            exit 1
          fi

          sudo systemctl start docker

          docker run -d \
            --name playit-agent \
            --restart unless-stopped \
            --network host \
            -e SECRET="$PLAYIT_SECRET" \
            ghcr.io/playit-cloud/playit-agent:latest

          sleep 5
          docker logs --tail 50 playit-agent || true

      - name: Executar servidor e criar backups
        shell: bash
        run: |
          set -Eeuo pipefail

          cd minecraft

          bash start.sh > ../logs/server.log 2>&1 &
          SERVER_PID=$!

          cleanup() {
            if kill -0 "$SERVER_PID" 2>/dev/null; then
              kill -TERM "$SERVER_PID" 2>/dev/null || true
              sleep 10
              kill -KILL "$SERVER_PID" 2>/dev/null || true
            fi

            docker stop playit-agent >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          backup_server() {
            local stamp archive temp_archive tar_status

            stamp="$(date -u +%Y%m%d-%H%M%S)"
            archive="../downloads/server-backup-${stamp}.tar.gz"
            temp_archive="${archive}.tmp"

            echo "Criando backup $stamp..."

            set +e
            tar --warning=no-file-changed \
              -czf "$temp_archive" \
              --exclude='./logs' \
              --exclude='./cache' \
              .
            tar_status=$?
            set -e

            if [[ ! -s "$temp_archive" ]] \
                || ! tar -tzf "$temp_archive" >/dev/null; then
              echo "::warning::Backup inválido; não será enviado."
              rm -f "$temp_archive"
              return 1
            fi

            mv "$temp_archive" "$archive"

            if (( tar_status != 0 )); then
              echo "::warning::Alguns arquivos mudaram durante o backup."
            fi

            if rclone copyto \
                gdrive2:server-backup-latest.tar.gz \
                ../downloads/server-backup-previous.tar.gz \
                --retries 2; then
              rclone copyto \
                ../downloads/server-backup-previous.tar.gz \
                gdrive2:server-backup-previous.tar.gz \
                --retries 2 || true
            fi

            rclone copyto "$archive" \
              gdrive2:server-backup-latest.tar.gz \
              --retries 3 \
              --low-level-retries 5

            echo "Backup enviado."
          }

          echo "Aguardando a inicialização..."
          sleep 120

          if ! kill -0 "$SERVER_PID" 2>/dev/null; then
            echo "::error::O servidor encerrou durante a inicialização."
            tail -n 150 ../logs/server.log || true
            exit 1
          fi

          backup_server || echo "::warning::Falha no backup inicial."

          END_TIME=$(( $(date +%s) + 19500 ))
          NEXT_BACKUP=$(( $(date +%s) + 600 ))

          while kill -0 "$SERVER_PID" 2>/dev/null; do
            NOW="$(date +%s)"

            if (( NOW >= END_TIME )); then
              break
            fi

            if (( NOW >= NEXT_BACKUP )); then
              backup_server || echo "::warning::Falha no backup periódico."
              NEXT_BACKUP=$(( $(date +%s) + 600 ))
            fi

            sleep 15
          done

          echo "Tentando backup final..."
          backup_server || echo "::warning::Falha no backup final."

          tail -n 100 ../logs/server.log || true

      - name: Diagnóstico em caso de falha
        if: failure()
        shell: bash
        run: |
          echo "Arquivos encontrados:"
          find minecraft -maxdepth 2 -type f \
            \( -name '*.jar' -o -name 'server.properties' -o -name 'eula.txt' \) \
            -printf '%p (%s bytes)\n' 2>/dev/null | head -200 || true

          echo
          tail -n 150 logs/server.log 2>/dev/null || true

          echo
          docker logs --tail 80 playit-agent 2>/dev/null || true
