name: Minecraft Test

on:
  workflow_dispatch:

jobs:
  minecraft:
    runs-on: ubuntu-latest

    steps:
      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Verificar Java
        run: |
          java -version

      - name: Baixar Paper
        run: |
          mkdir minecraft
          cd minecraft

          echo "Baixando Paper 1.21.11..."

          curl -fL \
            -o paper.jar \
            "https://api.papermc.io/v2/projects/paper/versions/1.21.11/builds/126/downloads/paper-1.21.11-126.jar"

          ls -lh paper.jar

      - name: Aceitar EULA
        run: |
          echo "eula=true" > minecraft/eula.txt

      - name: Iniciar Paper
        run: |
          cd minecraft
          java -Xms2G -Xmx8G -jar paper.jar nogui
