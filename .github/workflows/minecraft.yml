name: Minecraft Test

on:
  workflow_dispatch:

jobs:
  minecraft:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # JAVA
      # ============================================================
      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # ============================================================
      # FERRAMENTAS ESSENCIAIS
      # Instala jq antes de usá-lo no download do Paper.
      # ============================================================
      - name: Instalar ferramentas essenciais
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl jq unzip
          python3 -m pip install --upgrade pip
          python3 -m pip install gdown nbtlib

      # ============================================================
      # PAPER
      # ============================================================
      - name: Baixar Paper 1.21.11
        run: |
          set -euo pipefail
          mkdir -p minecraft
          cd minecraft

          RESPONSE=$(curl -fsSL \
            -H "User-Agent: fox-minecraft-test/1.0" \
            "https://fill.papermc.io/v3/projects/paper/versions/1.21.11/builds")

          DOWNLOAD_URL=$(echo "$RESPONSE" | \
            jq -r 'map(select(.channel == "STABLE")) | .[0].downloads["server:default"].url')

          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "ERRO: não foi possível encontrar o download do Paper."
            exit 1
          fi

          curl -fL \
            -H "User-Agent: fox-minecraft-test/1.0" \
            -o paper.jar \
            "$DOWNLOAD_URL"

          ls -lh paper.jar

      # ============================================================
      # EULA
      # ============================================================
      - name: Aceitar EULA
        run: echo "eula=true" > minecraft/eula.txt

      # ============================================================
      # FERRAMENTAS ADICIONAIS
      # ============================================================
      - name: Instalar ferramentas adicionais
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rclone

      # ============================================================
      # GOOGLE DRIVE
      # ============================================================
      - name: Configurar acesso ao Google Drive
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/rclone"
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode \
            > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"
          rclone version | head -n 1
          rclone listremotes

      # ============================================================
      # MAPAS BASE
      # ============================================================
      - name: Baixar mapas do Google Drive
        run: |
          set -euo pipefail
          mkdir -p minecraft

          gdown "https://drive.google.com/uc?id=1Mf7FoRa_P9Q9idPExaTa6S1hQz5sPbT-" \
            -O minecraft/world.zip

          gdown "https://drive.google.com/uc?id=1TDVch0u3PyuYrYtTTIYsroJm5dcQNrQM" \
            -O minecraft/world_nether.zip

          gdown "https://drive.google.com/uc?id=1SMTsfqiLlW3R3FpcgfQYZSNwhBw0JJgt" \
            -O minecraft/world_the_end.zip

          ls -lh minecraft/*.zip

      - name: Instalar mapas base
        run: |
          set -euo pipefail
          cd minecraft

          rm -rf world world_nether world_the_end
          unzip -q world.zip
          unzip -q world_nether.zip
          unzip -q world_the_end.zip

          rm -f world.zip world_nether.zip world_the_end.zip
          du -sh world world_nether world_the_end

      # ============================================================
      # RESTAURAR BACKUP ANTES DE INSTALAR OS PLUGINS
      # ============================================================
      - name: Restaurar último backup do servidor
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          set -euo pipefail
          mkdir -p backup_tmp

          echo "Verificando backups no Google Drive..."
          rclone lsf "gdrive2:" \
            --drive-root-folder-id "$GDRIVE_FOLDER_ID" \
            > backup_tmp/drive-files.txt

          cat backup_tmp/drive-files.txt

          if grep -Fxq "server-backup-latest.tar.gz" backup_tmp/drive-files.txt; then
            echo "Backup encontrado. Baixando..."

            rclone copyto \
              "gdrive2:server-backup-latest.tar.gz" \
              backup_tmp/server-backup-latest.tar.gz \
              --drive-root-folder-id "$GDRIVE_FOLDER_ID"

            echo "Validando backup..."
            tar -tzf backup_tmp/server-backup-latest.tar.gz > /dev/null

            echo "Restaurando backup..."
            rm -rf minecraft/world \
              minecraft/world_nether \
              minecraft/world_the_end \
              minecraft/plugins

            tar -xzf backup_tmp/server-backup-latest.tar.gz -C minecraft

            echo "Backup restaurado."
          else
            echo "Nenhum backup anterior encontrado. Usando os mapas base."
          fi

          rm -rf backup_tmp

      # ============================================================
      # BAIXAR NOVO PACOTE DE PLUGINS
      # ============================================================
      - name: Baixar plugins do Google Drive
        run: |
          set -euo pipefail
          mkdir -p minecraft

          PLUGINS_ID="1Zttp-T4pSqPAVhqihyZdDJ4rO2F-NaLm"

          echo "Baixando novo pacote de plugins..."

          gdown \
            "https://drive.google.com/uc?id=$PLUGINS_ID" \
            -O minecraft/plugins.zip

          file minecraft/plugins.zip
          unzip -t minecraft/plugins.zip

      # ============================================================
      # INSTALAR PLUGINS APÓS RESTAURAR O BACKUP
      # ============================================================
      - name: Instalar plugins e configurações
        run: |
          set -euo pipefail
          cd minecraft

          rm -rf plugins_temp
          mkdir -p plugins_temp plugins

          unzip -q plugins.zip -d plugins_temp

          echo "Estrutura do ZIP:"
          find plugins_temp -maxdepth 3 -print | sort

          SOURCE=""

          if [ -d "plugins_temp/plugins/Plugins" ]; then
            SOURCE="plugins_temp/plugins/Plugins"
          elif [ -d "plugins_temp/Plugins" ]; then
            SOURCE="plugins_temp/Plugins"
          elif [ -d "plugins_temp/plugins" ]; then
            SOURCE="plugins_temp/plugins"
          else
            SOURCE="plugins_temp"
          fi

          echo "Pasta de origem: $SOURCE"

          # Copia os JARs e arquivos do pacote novo.
          # Os arquivos com caminhos iguais serão atualizados.
          cp -a "$SOURCE"/. plugins/

          # Remove plugins que não devem ser instalados.
          rm -f plugins/OpenShulker*.jar
          rm -rf plugins/OpenShulker
          rm -f plugins/SkinsRestorer*.jar
          rm -rf plugins/SkinsRestorer

          # Remove estruturas aninhadas desnecessárias.
          rm -rf plugins/plugins plugins/Plugins

          # Evita manter a versão antiga conhecida do EssentialsX
          # junto da versão mais recente presente no pacote.
          rm -f plugins/EssentialsX-2.22.0.jar

          echo "JARs instalados:"
          find plugins -maxdepth 1 -type f -name "*.jar" \
            -printf "%f\n" | sort

          PLUGIN_COUNT=$(find plugins -maxdepth 1 -type f -name "*.jar" | wc -l)

          if [ "$PLUGIN_COUNT" -eq 0 ]; then
            echo "ERRO: nenhum arquivo JAR foi encontrado."
            find plugins -maxdepth 4 -print
            exit 1
          fi

          echo "Total de JARs: $PLUGIN_COUNT"
          echo "Pastas de configuração:"
          find plugins -mindepth 1 -maxdepth 1 -type d -printf "%f\n" | sort
          du -sh plugins

          rm -rf plugins_temp
          rm -f plugins.zip

      # ============================================================
      # CONFIGURAÇÕES DO ATERNOS
      # ============================================================
      - name: Instalar configurações do Aternos
        run: |
          set -euo pipefail

          CONFIG_ARCHIVE_ID="1SuYS0eR0qjTvEH5FaUZuv0lApttcQ3hG"
          mkdir -p config_aternos_tmp minecraft

          gdown \
            "https://drive.google.com/uc?id=${CONFIG_ARCHIVE_ID}" \
            -O config_aternos_tmp/configuracoes-aternos.zip

          unzip -t config_aternos_tmp/configuracoes-aternos.zip
          unzip -q config_aternos_tmp/configuracoes-aternos.zip \
            -d config_aternos_tmp/extracted

          OPS_FILE="$(find config_aternos_tmp/extracted \
            -type f -name 'ops.json' -print -quit)"

          if [ -z "$OPS_FILE" ]; then
            echo "ERRO: ops.json não encontrado no ZIP."
            exit 1
          fi

          CONFIG_ROOT="$(dirname "$OPS_FILE")"

          if [ ! -f "$CONFIG_ROOT/server.properties" ]; then
            echo "ERRO: server.properties não encontrado junto de ops.json."
            exit 1
          fi

          for file in \
            banned-ips.json banned-players.json bukkit.yml commands.yml \
            help.yml ops.json server.properties spigot.yml whitelist.json; do
            if [ -f "$CONFIG_ROOT/$file" ]; then
              cp "$CONFIG_ROOT/$file" minecraft/
              echo "Instalado: $file"
            fi
          done

          if [ -d "$CONFIG_ROOT/config" ]; then
            rm -rf minecraft/config
            cp -a "$CONFIG_ROOT/config" minecraft/config
          fi

          # Mantém online-mode=false para a configuração atual do servidor.
          if grep -qE '^[[:space:]]*online-mode=' minecraft/server.properties; then
            sed -i -E 's/^[[:space:]]*online-mode=.*/online-mode=false/' \
              minecraft/server.properties
          else
            echo 'online-mode=false' >> minecraft/server.properties
          fi

          # Preserva os demais operadores e garante o OP configurado.
          jq --arg uuid "aa1e9712-b2a7-32d4-95cf-4cd92133b658" \
             --arg name "AgenteFox4" '
            if any(.[]; ((.uuid // "") | ascii_downcase) == ($uuid | ascii_downcase)) then
              map(if ((.uuid // "") | ascii_downcase) == ($uuid | ascii_downcase)
                  then .name = $name | .level = 4
                  else . end)
            else
              . + [{"uuid": $uuid, "name": $name, "level": 4,
                    "bypassesPlayerLimit": false}]
            end
          ' minecraft/ops.json > minecraft/ops.json.tmp

          mv minecraft/ops.json.tmp minecraft/ops.json

          jq -e 'any(.[]; ((.uuid // "") | ascii_downcase) ==
            "aa1e9712-b2a7-32d4-95cf-4cd92133b658" and .level == 4)' \
            minecraft/ops.json > /dev/null

          grep -E '^[[:space:]]*online-mode=' minecraft/server.properties

          rm -rf config_aternos_tmp

      # ============================================================
      # PLAYIT
      # ============================================================
      - name: Iniciar Playit
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          set -euo pipefail

          docker rm -f playit 2>/dev/null || true

          docker run \
            -d \
            --name playit \
            --network host \
            --restart unless-stopped \
            -e SECRET_KEY="$PLAYIT_SECRET" \
            ghcr.io/playit-cloud/playit-agent:latest

          sleep 10
          docker logs playit

      - name: Verificar Playit
        run: |
          docker ps --filter "name=playit"
          docker logs --tail 50 playit

      # ============================================================
      # VERIFICAÇÃO FINAL DOS PLUGINS
      # ============================================================
      - name: Verificar plugins antes de iniciar
        run: |
          set -euo pipefail
          cd minecraft

          echo "JARs:"
          find plugins -maxdepth 1 -type f -name "*.jar" \
            -printf "%f\n" | sort

          PLUGIN_COUNT=$(find plugins -maxdepth 1 -type f -name "*.jar" | wc -l)
          echo "Total: $PLUGIN_COUNT"

          if [ "$PLUGIN_COUNT" -eq 0 ]; then
            echo "ERRO: nenhum plugin instalado."
            find plugins -maxdepth 4 -print
            exit 1
          fi

          echo "Verificando possíveis JARs duplicados do EssentialsX:"
          find plugins -maxdepth 1 -type f -iname 'EssentialsX*.jar' -printf '%f\n' | sort

          echo "Tamanho da pasta:"
          du -sh plugins

      # ============================================================
      # INICIAR MINECRAFT E BACKUPS PERIÓDICOS
      # ============================================================
      - name: Iniciar Minecraft e fazer backups periódicos
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          set -euo pipefail
          cd minecraft

          java -version
          ls -lh paper.jar
          du -sh world world_nether world_the_end
          find plugins -maxdepth 1 -type f -name '*.jar' \
            -printf '%f\n' | sort

          cat > /tmp/minecraft_session.py <<'PY'
          import os
          import subprocess
          import time
          import tarfile
          from pathlib import Path

          folder_id = os.environ["GDRIVE_FOLDER_ID"]
          root = Path.cwd()
          archive = Path("/tmp/server-backup-latest.tar.gz")
          log_path = root / "server.log"

          max_session_seconds = 5 * 60 * 60 + 25 * 60
          backup_interval_seconds = 10 * 60

          with log_path.open("a", buffering=1) as log:
              server = subprocess.Popen(
                  ["java", "-Xms2G", "-Xmx8G", "-jar", "paper.jar", "nogui"],
                  stdin=subprocess.PIPE,
                  stdout=log,
                  stderr=subprocess.STDOUT,
                  text=True,
                  bufsize=1,
              )

              def command(text):
                  if server.poll() is None and server.stdin:
                      server.stdin.write(text + "\n")
                      server.stdin.flush()

              def make_backup(label):
                  print(f"Iniciando backup ({label})...", flush=True)
                  command("save-all flush")
                  time.sleep(5)
                  command("save-off")
                  time.sleep(2)

                  try:
                      members = [
                          name for name in [
                              "world", "world_nether", "world_the_end", "plugins",
                              "server.properties", "ops.json", "whitelist.json",
                              "banned-players.json", "banned-ips.json", "usercache.json"
                          ] if (root / name).exists()
                      ]

                      required = ["world", "world_nether", "world_the_end"]
                      if not all((root / name).exists() for name in required):
                          raise RuntimeError(
                              "Um ou mais mundos não foram encontrados; backup cancelado."
                          )

                      with tarfile.open(archive, "w:gz") as tar:
                          for name in members:
                              tar.add(root / name, arcname=name, recursive=True)

                      # Tenta preservar o backup anterior antes de atualizar o atual.
                      subprocess.run([
                          "rclone", "copyto",
                          "gdrive2:server-backup-latest.tar.gz",
                          "gdrive2:server-backup-previous.tar.gz",
                          "--drive-root-folder-id", folder_id
                      ], check=False, stdout=log, stderr=subprocess.STDOUT)

                      subprocess.run([
                          "rclone", "copyto", str(archive),
                          "gdrive2:server-backup-latest.tar.gz",
                          "--drive-root-folder-id", folder_id
                      ], check=True, stdout=log, stderr=subprocess.STDOUT)

                      print(f"Backup enviado ao Google Drive ({label}).", flush=True)
                  finally:
                      command("save-on")

              started = time.monotonic()
              next_backup = started + 120

              print(
                  "Servidor iniciado. Primeiro backup em 2 minutos; "
                  "depois, a cada 10 minutos.",
                  flush=True
              )

              try:
                  while server.poll() is None:
                      now = time.monotonic()

                      if now >= started + max_session_seconds:
                          print("Limite de sessão atingido; preparando encerramento.", flush=True)
                          break

                      if now >= next_backup:
                          make_backup("periódico")
                          next_backup = time.monotonic() + backup_interval_seconds

                      time.sleep(5)

                  if server.poll() is None:
                      make_backup("final")
                      command("stop")

                      try:
                          server.wait(timeout=90)
                      except subprocess.TimeoutExpired:
                          server.terminate()
                          try:
                              server.wait(timeout=15)
                          except subprocess.TimeoutExpired:
                              server.kill()
                              server.wait()
                  else:
                      print(f"Servidor encerrou com código {server.returncode}.", flush=True)

              except Exception:
                  print(
                      "ERRO durante a sessão/backup; tentando encerrar com segurança.",
                      flush=True
                  )

                  if server.poll() is None:
                      command("save-all flush")
                      time.sleep(5)
                      command("stop")

                      try:
                          server.wait(timeout=60)
                      except subprocess.TimeoutExpired:
                          server.terminate()
                          server.wait(timeout=15)

                  raise

              if server.returncode not in (0, None):
                  raise SystemExit(server.returncode)
          PY

          touch server.log
          tail -n +1 -F server.log &
          TAIL_PID=$!

          set +e
          python3 /tmp/minecraft_session.py
          RESULT=$?
          set -e

          kill "$TAIL_PID" 2>/dev/null || true
          exit "$RESULT"

      # ============================================================
      # LOGS FINAIS DO PLAYIT
      # ============================================================
      - name: Mostrar logs do Playit
        if: always()
        run: |
          echo "Logs finais do Playit:"
          docker logs playit || true
